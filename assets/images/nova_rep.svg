<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Nova — LazerVault voice customer-rep avatar (flat 2D, brand purple) -->
  <defs>
    <linearGradient id="novaBg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B45C9"/>
      <stop offset="1" stop-color="#3D2F8B"/>
    </linearGradient>
    <linearGradient id="novaHair" x1="60" y1="40" x2="180" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2140"/>
      <stop offset="1" stop-color="#1C1730"/>
    </linearGradient>
    <linearGradient id="novaShirt" x1="60" y1="170" x2="180" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#5B45C9"/>
    </linearGradient>
  </defs>

  <!-- Backdrop disc -->
  <circle cx="120" cy="120" r="120" fill="url(#novaBg)"/>
  <circle cx="120" cy="120" r="120" fill="#0A0A0C" fill-opacity="0.06"/>

  <!-- Shoulders / shirt -->
  <path d="M44 240c0-34 34-58 76-58s76 24 76 58H44z" fill="url(#novaShirt)"/>
  <path d="M104 188c5 9 11 14 16 14s11-5 16-14l-4 52h-24l-4-52z" fill="#FFFFFF" fill-opacity="0.16"/>

  <!-- Neck -->
  <path d="M104 168h32v22c0 9-7 16-16 16s-16-7-16-16v-22z" fill="#E7A985"/>

  <!-- Hair back -->
  <path d="M60 116c0-37 27-66 60-66s60 29 60 66c0 16-4 28-10 38V120c0-28-22-46-50-46s-50 18-50 46v34c-6-10-10-22-10-38z" fill="url(#novaHair)"/>

  <!-- Face -->
  <path d="M74 112c0-26 21-44 46-44s46 18 46 44v18c0 30-21 52-46 52s-46-22-46-52v-18z" fill="#F4B892"/>
  <!-- Cheek shade -->
  <path d="M74 124c0 30 21 52 46 52 6 0 12-1 17-4-23-3-41-24-41-52v-12c0-13 5-24 13-32-21 5-35 24-35 48v0z" fill="#000000" fill-opacity="0.05"/>

  <!-- Eyebrows -->
  <rect x="92" y="116" width="20" height="5" rx="2.5" fill="#2A2140"/>
  <rect x="128" y="116" width="20" height="5" rx="2.5" fill="#2A2140"/>
  <!-- Eyes -->
  <circle cx="102" cy="128" r="5.5" fill="#2A2140"/>
  <circle cx="138" cy="128" r="5.5" fill="#2A2140"/>
  <circle cx="104" cy="126" r="1.8" fill="#FFFFFF"/>
  <circle cx="140" cy="126" r="1.8" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M108 148c4 5 20 5 24 0" stroke="#A65A3A" stroke-width="4" stroke-linecap="round"/>

  <!-- Hair front fringe -->
  <path d="M70 112c0-30 24-50 50-50s50 20 50 50c-8-16-26-26-50-26s-42 10-50 26z" fill="url(#novaHair)"/>

  <!-- Headset band -->
  <path d="M64 124c0-34 25-60 56-60s56 26 56 60" stroke="#11101A" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M64 124c0-34 25-60 56-60s56 26 56 60" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none" stroke-opacity="0.55"/>
  <!-- Ear cups -->
  <rect x="54" y="120" width="20" height="34" rx="9" fill="#1A1830"/>
  <rect x="166" y="120" width="20" height="34" rx="9" fill="#1A1830"/>
  <rect x="58" y="126" width="12" height="22" rx="6" fill="#3B82F6" fill-opacity="0.5"/>
  <rect x="170" y="126" width="12" height="22" rx="6" fill="#3B82F6" fill-opacity="0.5"/>

  <!-- Boom mic -->
  <path d="M170 142c0 28-18 40-40 44" stroke="#11101A" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="128" cy="187" r="8" fill="#11101A"/>
  <circle cx="128" cy="187" r="3.5" fill="#3B82F6"/>
</svg>
