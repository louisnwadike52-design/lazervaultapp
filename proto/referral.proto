syntax = "proto3";

package pb;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

option go_package = "referral-service/proto";

// Referral status enum
enum ReferralStatus {
  REFERRAL_STATUS_PENDING = 0;
  REFERRAL_STATUS_COMPLETED = 1;
  REFERRAL_STATUS_FAILED = 2;
  REFERRAL_STATUS_CANCELLED = 3;
}

// Point source types
enum PointSource {
  POINT_SOURCE_REFERRAL = 0;
  POINT_SOURCE_SIGNUP_BONUS = 1;
  POINT_SOURCE_FIRST_TRANSACTION = 2;
  POINT_SOURCE_MONTHLY_ACTIVE = 3;
  POINT_SOURCE_ACHIEVEMENT = 4;
  POINT_SOURCE_REDEMPTION = 5;
}

// ReferralCode message represents a user's referral code
message ReferralCode {
  uint64 id = 1;
  uint64 user_id = 2;
  string code = 3;
  bool is_active = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ReferralTransaction message represents a referral event
message ReferralTransaction {
  uint64 id = 1;
  uint64 referrer_user_id = 2;
  uint64 referee_user_id = 3;
  string referral_code_used = 4;
  ReferralStatus status = 5;
  int32 referrer_reward_amount = 6;
  int32 referee_reward_amount = 7;
  string currency = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  string failure_reason = 11;
  string referee_first_name = 12;
  string referee_last_name = 13;
  string referee_username = 14;
  string referrer_username = 15;
  bool referee_has_joined = 16;
}

// CountryRewardConfig message represents country-specific reward configuration
message CountryRewardConfig {
  uint64 id = 1;
  string country_code = 2;
  string currency = 3;
  int32 referrer_reward = 4;
  int32 referee_reward = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ReferralStats message represents aggregated referral statistics
message ReferralStats {
  int64 total_referrals = 1;
  int32 total_rewards_earned = 2;
  int32 pending_rewards = 3;
  string currency = 4;
  int32 pending_referrals = 5;
  int32 completed_referrals = 6;
}

// LeaderboardEntry message represents a top referrer
message LeaderboardEntry {
  uint64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string username = 4;
  int64 total_referrals = 5;
  int32 rank = 6;
  int32 total_rewards_earned = 7;
  string currency = 8;
  string profile_picture = 9;
}

// PointTransaction represents a single points ledger entry
message PointTransaction {
  uint64 id = 1;
  uint64 user_id = 2;
  int32 points = 3;
  PointSource source = 4;
  string reference_id = 5;
  string description = 6;
  google.protobuf.Timestamp created_at = 7;
}

// PointsBalance represents a user's current points state
message PointsBalance {
  int32 total_earned = 1;
  int32 total_redeemed = 2;
  int32 current_balance = 3;
  string tier = 4;
}

// PointsConfigEntry represents a single earn rule
message PointsConfigEntry {
  string source = 1;
  int32 points_amount = 2;
  string description = 3;
  bool is_active = 4;
}

// Request/Response messages for ValidateReferralCode
message ValidateReferralCodeRequest {
  string code = 1;
}

message ValidateReferralCodeResponse {
  bool is_valid = 1;
  string message = 2;
}

// Request/Response messages for GetMyReferralCode
message GetMyReferralCodeRequest {}

message GetMyReferralCodeResponse {
  ReferralCode referral_code = 1;
}

// Request/Response messages for GetMyReferralStats
message GetMyReferralStatsRequest {}

message GetMyReferralStatsResponse {
  ReferralStats stats = 1;
}

// Request/Response messages for GetMyReferrals
message GetMyReferralsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string filter = 3; // "all", "joined", "pending"
}

message GetMyReferralsResponse {
  repeated ReferralTransaction referrals = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}

// Request/Response messages for GetReferralLeaderboard
message GetReferralLeaderboardRequest {
  int32 limit = 1;
}

message GetReferralLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}

// Request/Response messages for GetCountryRewardConfig
message GetCountryRewardConfigRequest {
  string country_code = 1;
}

message GetCountryRewardConfigResponse {
  CountryRewardConfig config = 1;
}

// Request/Response messages for RecordReferral
message RecordReferralRequest {
  uint64 referee_user_id = 1;
  string referral_code = 2;
}

message RecordReferralResponse {
  bool success = 1;
  string message = 2;
  ReferralTransaction transaction = 3;
}

// Request/Response messages for CreditReferralRewards
message CreditReferralRewardsRequest {
  uint64 transaction_id = 1;
}

message CreditReferralRewardsResponse {
  bool success = 1;
  string message = 2;
}

// Request/Response messages for LazerPoints
message GetMyPointsBalanceRequest {}

message GetMyPointsBalanceResponse {
  PointsBalance balance = 1;
}

message GetMyPointsHistoryRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetMyPointsHistoryResponse {
  repeated PointTransaction transactions = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}

message GetPointsConfigRequest {}

message GetPointsConfigResponse {
  repeated PointsConfigEntry configs = 1;
}

// ReferralService service definition
service ReferralService {
  // Validate if a referral code exists and is active
  rpc ValidateReferralCode(ValidateReferralCodeRequest) returns (ValidateReferralCodeResponse) {
    option (google.api.http) = {
      post: "/v1/referral/validate"
      body: "*"
    };
  }

  // Get the authenticated user's referral code
  rpc GetMyReferralCode(GetMyReferralCodeRequest) returns (GetMyReferralCodeResponse) {
    option (google.api.http) = {
      get: "/v1/referral/my-code"
    };
  }

  // Get aggregated referral statistics for the authenticated user
  rpc GetMyReferralStats(GetMyReferralStatsRequest) returns (GetMyReferralStatsResponse) {
    option (google.api.http) = {
      get: "/v1/referral/my-stats"
    };
  }

  // Get paginated list of referrals made by the authenticated user
  rpc GetMyReferrals(GetMyReferralsRequest) returns (GetMyReferralsResponse) {
    option (google.api.http) = {
      get: "/v1/referral/my-referrals"
    };
  }

  // Get referral leaderboard (top referrers)
  rpc GetReferralLeaderboard(GetReferralLeaderboardRequest) returns (GetReferralLeaderboardResponse) {
    option (google.api.http) = {
      get: "/v1/referral/leaderboard"
    };
  }

  // Get reward configuration for a specific country
  rpc GetCountryRewardConfig(GetCountryRewardConfigRequest) returns (GetCountryRewardConfigResponse) {
    option (google.api.http) = {
      get: "/v1/referral/country-config/{country_code}"
    };
  }

  // Record a referral transaction (internal use)
  rpc RecordReferral(RecordReferralRequest) returns (RecordReferralResponse) {
    option (google.api.http) = {
      post: "/v1/referral/record"
      body: "*"
    };
  }

  // Credit referral rewards to both referrer and referee (internal use)
  rpc CreditReferralRewards(CreditReferralRewardsRequest) returns (CreditReferralRewardsResponse) {
    option (google.api.http) = {
      post: "/v1/referral/credit-rewards"
      body: "*"
    };
  }

  // Get the authenticated user's LazerPoints balance
  rpc GetMyPointsBalance(GetMyPointsBalanceRequest) returns (GetMyPointsBalanceResponse) {
    option (google.api.http) = {
      get: "/v1/referral/points/balance"
    };
  }

  // Get the authenticated user's points transaction history
  rpc GetMyPointsHistory(GetMyPointsHistoryRequest) returns (GetMyPointsHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/referral/points/history"
    };
  }

  // Get points earn rules configuration
  rpc GetPointsConfig(GetPointsConfigRequest) returns (GetPointsConfigResponse) {
    option (google.api.http) = {
      get: "/v1/referral/points/config"
    };
  }

  // Convert LazerPoints into cash in the caller's wallet.
  //
  // Idempotent on (caller, idempotency_key): a phone that times out and retries
  // must convert once, not twice. The cash is paid from a funded platform
  // wallet, so a redemption is real money leaving the business rather than a
  // number being minted.
  rpc RedeemPoints(RedeemPointsRequest) returns (RedeemPointsResponse) {
    option (google.api.http) = {
      post: "/v1/referral/points/redeem"
      body: "*"
    };
  }

  // Award points for a completed transaction. SERVICE-TO-SERVICE.
  //
  // Called by accounts-service after a transaction commits. Idempotent on
  // transaction_id: at-least-once delivery and retries must award once.
  //
  // Not user-authenticated — the caller is a service acting on behalf of a user
  // it has already authenticated, and the user_id is supplied rather than taken
  // from a token.
  rpc AwardTransactionPoints(AwardTransactionPointsRequest) returns (AwardTransactionPointsResponse) {
    option (google.api.http) = {
      post: "/v1/internal/referral/points/award-transaction"
      body: "*"
    };
  }

  // Claw back points when a transaction is refunded. SERVICE-TO-SERVICE.
  //
  // Without it, buy -> earn -> refund mints a rewards balance out of nothing.
  rpc ReverseTransactionPoints(ReverseTransactionPointsRequest) returns (ReverseTransactionPointsResponse) {
    option (google.api.http) = {
      post: "/v1/internal/referral/points/reverse-transaction"
      body: "*"
    };
  }

  // What a conversion would be worth, without performing it.
  //
  // Exists so the app can show the cash value and the minimum BEFORE the user
  // commits. Quoting client-side would duplicate the rate and the rounding
  // rule, and the two would drift.
  rpc GetRedemptionQuote(GetRedemptionQuoteRequest) returns (GetRedemptionQuoteResponse) {
    option (google.api.http) = {
      get: "/v1/referral/points/redeem/quote"
    };
  }

  // Where a user's points came from, per product.
  //
  // The rewards screen showed a total and a flat list of history rows, so
  // "most of this came from bill payments" was not answerable without scrolling
  // the entire ledger — and a rewards balance nobody can account for is a
  // rewards balance nobody trusts.
  rpc GetPointsBreakdown(GetPointsBreakdownRequest) returns (GetPointsBreakdownResponse) {
    option (google.api.http) = {
      get: "/v1/referral/points/breakdown"
    };
  }

  // ── REFERRAL BONUS: earned, then deposited automatically ────────────────
  //
  // A bonus is earned when the referred user passes KYC, recorded in the
  // referral bonus ledger, and DEPOSITED into the referrer's personal wallet
  // by a worker — which then sends them a push notification. There is no claim
  // step: the user does nothing.
  //
  // The ledger is also the analytics: one row per bonus, carrying who earned
  // it, which referral produced it, when it was paid and where it went.

  // GetReferralBonusBalance reports what the caller has accrued, what is in
  // flight, and whether the programme is still running.
  rpc GetReferralBonusBalance(GetReferralBonusBalanceRequest) returns (GetReferralBonusBalanceResponse) {
    option (google.api.http) = {
      get: "/v1/referral/bonus/balance"
    };
  }

  // WithdrawReferralBonus ALWAYS REFUSES with FailedPrecondition.
  //
  // Retained only so a client built against the old claim-step contract gets
  // one clear sentence saying bonuses are deposited automatically, rather than
  // an Internal error it would render as "something went wrong". Do not build
  // against it.
  rpc WithdrawReferralBonus(WithdrawReferralBonusRequest) returns (WithdrawReferralBonusResponse) {
    option (google.api.http) = {
      post: "/v1/referral/bonus/withdraw"
      body: "*"
    };
  }
}

message GetPointsBreakdownRequest {}

// ServicePointsBreakdown is one product's contribution to a balance.
message ServicePointsBreakdown {
  // The canonical product key — "crypto", "giftcards", "bills".
  string service_key = 1;
  // Resolved server-side so every client names a product the same way, and so
  // renaming one does not need an app release.
  string display_name = 2;
  int32 points = 3;
  // How many earning events made up those points, so a large total from one
  // big transaction reads differently from the same total earned steadily.
  int32 transactions = 4;
}

message GetPointsBreakdownResponse {
  repeated ServicePointsBreakdown items = 1;
  // The sum of the items, computed server-side. The client must not add these
  // up itself: the list is capped for display and the total would silently
  // disagree with the balance shown directly above it.
  int32 total_points = 2;
}

message RedeemPointsRequest {
  int32 points = 1;
  // Caller-generated, stable across retries of the SAME attempt.
  string idempotency_key = 2;
  // Raw transaction PIN.
  //
  // Converting points takes real money out of the rewards wallet, and this was
  // the only cash-out in the product that asked for nothing. Verified
  // server-side against auth-service BEFORE any debit: a client-side check is
  // advice, not a gate, because the client can be modified.
  string pin = 3;
}

message RedeemPointsResponse {
  int32 points_redeemed = 1;
  // Kobo, like every amount crossing a service boundary here.
  int64 cash_minor = 2;
  string currency = 3;
  int32 new_balance = 4;
  string reference = 5;
}

message GetRedemptionQuoteRequest {
  // 0 quotes the caller's WHOLE balance, which is what the screen opens on.
  int32 points = 1;
}

message GetRedemptionQuoteResponse {
  int32 points = 1;
  int64 cash_minor = 2;
  string currency = 3;
  // How many points buy one major unit. Shown so the rate is visible rather
  // than implied by a number the user has to reverse-engineer.
  int32 points_per_major_unit = 4;
  int32 min_redeem_points = 5;
  // False when the balance is under the minimum or the rate is unset. Carries
  // the reason so the button can explain itself instead of being inert.
  bool can_redeem = 6;
  string reason = 7;
}

message AwardTransactionPointsRequest {
  string user_id = 1;
  // The idempotency anchor. One transaction earns once however many times its
  // completion is delivered.
  string transaction_id = 2;
  // Minor units (kobo).
  int64 amount_minor = 3;
  string currency = 4;
  // What was paid for, shown in the user's points history so the earn is
  // recognisable rather than an unexplained credit.
  string service_type = 5;
}

message AwardTransactionPointsResponse {
  int32 points_awarded = 1;
}

message ReverseTransactionPointsRequest {
  string user_id = 1;
  string transaction_id = 2;
}

message ReverseTransactionPointsResponse {
  int32 points_reversed = 1;
}


// ── REFERRAL BONUS MESSAGES ─────────────────────────────────────────────────

// ReferralBonusBalance is somebody's referral EARNINGS.
//
// Nothing here is claimable — bonuses are deposited automatically — so
// available_minor is always 0. The field names predate that change and are
// kept because renaming them would break the contract for no behavioural gain;
// read each one by its comment, not its name.
//
// Every amount is in MINOR units of `currency` — kobo for NGN — matching
// country_reward_configs and referral_transactions. Sending major units here
// would be a 100x error on the one number the user acts on.
message ReferralBonusBalance {
  // ALWAYS 0. There is no claim step, so there is never a balance sitting
  // here waiting to be collected. Kept so the message shape is unchanged.
  int64 available_minor = 1;
  // Everything ever EARNED. This is the headline number on the referral
  // screen and the one the admin reports total.
  int64 lifetime_accrued_minor = 2;
  // Everything that has reached the user's personal wallet.
  int64 lifetime_withdrawn_minor = 3;
  // Earned but not yet deposited — normally for less than a minute, longer if
  // the user has no personal wallet in this currency yet. Shown so the gap
  // between "my friend verified" and "money arrived" is never silent.
  int64 pending_withdrawal_minor = 4;
  string currency = 5;
  // FALSE once the referral programme is discontinued. Bonuses already earned
  // are still paid — money already earned is the user's, and a programme
  // ending is not a reason to cancel an obligation. New referrals simply stop
  // being taken.
  bool programme_active = 6;
  // UNUSED since bonuses became automatic — there is no amount for a user to
  // choose, so there is nothing to apply a floor to. Kept at 0.
  int64 minimum_withdrawal_minor = 7;
  // Set when the programme is discontinued, so the app can say so in the words
  // the operator chose rather than inventing copy.
  string programme_notice = 8;
}

message GetReferralBonusBalanceRequest {}

message GetReferralBonusBalanceResponse {
  ReferralBonusBalance balance = 1;
}

message WithdrawReferralBonusRequest {
  // Minor units. Must be > 0, >= minimum_withdrawal_minor, and <=
  // available_minor; the server re-checks all three against its own ledger.
  int64 amount_minor = 1;
  // The caller's own id for this attempt. A phone that times out and retries
  // must not withdraw twice, so the same key means the same withdrawal.
  string idempotency_key = 2;
  // Raw transaction PIN, verified server-side before anything moves.
  string pin = 3;
}

message WithdrawReferralBonusResponse {
  string withdrawal_id = 1;
  int64 amount_minor = 2;
  string currency = 3;
  // What is left after this withdrawal, so the app does not have to re-fetch
  // to redraw the balance.
  int64 remaining_minor = 4;
  // Where it landed, in words — always the personal wallet.
  string destination = 5;
  google.protobuf.Timestamp completed_at = 6;
}
