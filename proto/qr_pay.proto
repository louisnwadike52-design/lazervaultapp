syntax = "proto3";

package qr_pay;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "qr-pay-service/proto";

// QRPayService - QR code-based payment service
service QRPayService {
  // Generate a QR code for receiving payment
  rpc GenerateQR(GenerateQRRequest) returns (GenerateQRResponse) {
    option (google.api.http) = {
      post: "/api/v1/qrpay/generate"
      body: "*"
    };
  }

  // Get QR code details by code string (for scanner)
  rpc GetQRDetails(GetQRDetailsRequest) returns (GetQRDetailsResponse) {
    option (google.api.http) = {
      get: "/api/v1/qrpay/details/{qr_code}"
    };
  }

  // Process payment via scanned QR code
  rpc ProcessQRPayment(ProcessQRPaymentRequest) returns (ProcessQRPaymentResponse) {
    option (google.api.http) = {
      post: "/api/v1/qrpay/pay"
      body: "*"
    };
  }

  // Get user's generated QR codes
  rpc GetMyGeneratedQRCodes(GetMyGeneratedQRCodesRequest) returns (GetMyGeneratedQRCodesResponse) {
    option (google.api.http) = {
      get: "/api/v1/qrpay/generated"
    };
  }

  // Get user's QR payment history
  rpc GetMyQRPayments(GetMyQRPaymentsRequest) returns (GetMyQRPaymentsResponse) {
    option (google.api.http) = {
      get: "/api/v1/qrpay/payments"
    };
  }

  // Cancel a pending QR code
  rpc CancelQR(CancelQRRequest) returns (CancelQRResponse) {
    option (google.api.http) = {
      post: "/api/v1/qrpay/cancel"
      body: "*"
    };
  }

  // Get receipt data for a completed QR transaction
  // Creator edits/clears the optional expiry after creation (0 = none). A
  // still-valid new window also revives an EXPIRED code.
  rpc UpdateQRExpiry(UpdateQRExpiryRequest) returns (UpdateQRExpiryResponse) {
    option (google.api.http) = {
      put: "/api/v1/qrpay/{qr_id}/expiry"
      body: "*"
    };
  }

  // Creator lists everyone who paid one QR code (reusable codes accumulate
  // many), newest first, with the completed total.
  rpc GetQRPayers(GetQRPayersRequest) returns (GetQRPayersResponse) {
    option (google.api.http) = {
      get: "/api/v1/qrpay/{qr_id}/payers"
    };
  }

  rpc GetQRTransactionReceipt(GetQRTransactionReceiptRequest) returns (GetQRTransactionReceiptResponse) {
    option (google.api.http) = {
      get: "/api/v1/qrpay/receipt/{transaction_id}"
    };
  }
}

// Enums
enum QRType {
  QR_TYPE_DYNAMIC = 0;
  QR_TYPE_STATIC = 1;
}

enum QRStatus {
  QR_STATUS_PENDING = 0;
  QR_STATUS_PAID = 1;
  QR_STATUS_CANCELLED = 2;
  QR_STATUS_EXPIRED = 3;
}

// Models
message QRCode {
  string id = 1;
  string user_id = 2;
  string username = 3;
  string full_name = 4;
  string qr_code = 5;
  double amount = 6;
  string currency = 7;
  string description = 8;
  QRType qr_type = 9;
  QRStatus status = 10;
  google.protobuf.Timestamp created_at = 11;
  // Unset when the code never expires (no_expiry = true).
  google.protobuf.Timestamp expires_at = 12;
  google.protobuf.Timestamp paid_at = 13;
  // "one_time" | "reusable". Dynamic codes are always reusable.
  string usage_mode = 14;
  bool no_expiry = 15;
}

message QRTransaction {
  string id = 1;
  string qr_id = 2;
  string payer_id = 3;
  string payer_username = 4;
  string payer_name = 5;
  string recipient_id = 6;
  string recipient_username = 7;
  string recipient_name = 8;
  double amount = 9;
  string currency = 10;
  string description = 11;
  string reference_number = 12;
  QRStatus status = 13;
  google.protobuf.Timestamp created_at = 14;
}

// Request/Response messages
message GenerateQRRequest {
  double amount = 1;
  string currency = 2;
  string description = 3;
  QRType qr_type = 4;
  // 0 = no expiry (the default). Editable later via UpdateQRExpiry.
  int32 validity_minutes = 5;
  // "one_time" (default for static) | "reusable". Dynamic is always reusable.
  string usage_mode = 6;
}

message GenerateQRResponse {
  QRCode qr_code = 1;
  string qr_data = 2;
  string message = 3;
}

message GetQRDetailsRequest {
  string qr_code = 1;
}

message GetQRDetailsResponse {
  QRCode qr_code = 1;
}

message ProcessQRPaymentRequest {
  string qr_code = 1;
  string source_account_id = 2;
  double amount = 3;
  string transaction_pin = 4;
  string idempotency_key = 5;
}

message ProcessQRPaymentResponse {
  QRTransaction transaction = 1;
  double new_balance = 2;
  string message = 3;
}

message GetMyGeneratedQRCodesRequest {
  int32 limit = 1;
  int32 offset = 2;
  // QR_STATUS_PENDING is enum value 0 == the proto3 default, so an UNSET
  // filter is indistinguishable from "pending" — which silently hid every
  // paid/cancelled/expired QR from the history screen. Set include_all to
  // list every status regardless of status_filter.
  QRStatus status_filter = 3;
  bool include_all = 4;
}

message GetMyGeneratedQRCodesResponse {
  repeated QRCode qr_codes = 1;
  int32 total = 2;
}

message GetMyQRPaymentsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetMyQRPaymentsResponse {
  repeated QRTransaction transactions = 1;
  int32 total = 2;
}

message CancelQRRequest {
  string qr_id = 1;
}

message CancelQRResponse {
  string message = 1;
}

message GetQRTransactionReceiptRequest {
  string transaction_id = 1;
}

message GetQRTransactionReceiptResponse {
  QRTransaction transaction = 1;
}

message UpdateQRExpiryRequest {
  string qr_id = 1;
  // Minutes from NOW until expiry; 0 clears the expiry (never expires).
  int32 validity_minutes = 2;
}

message UpdateQRExpiryResponse {
  QRCode qr_code = 1;
  string message = 2;
}

message GetQRPayersRequest {
  string qr_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetQRPayersResponse {
  repeated QRTransaction transactions = 1;
  int32 total = 2;
  // Sum of completed payments on this code, major units.
  double total_collected = 3;
}
