  string reference = 14;
  string provider_ref = 15;
  string provider = 16;
  string narration = 17;
  string failure_reason = 18;
  string created_at = 19;
  string completed_at = 20;
  // Fire time for status=="scheduled" rows (RFC3339); empty otherwise.
  string scheduled_at = 21;
}

