// ===== TRANSFER ASYNC CONFIGURATION =====
//
// Admin-tunable knobs for the SendFunds / batch transfer flow. Mirrors the
// utility-payments AsyncPaymentConfig pattern (system_settings rows read
// per-request via a 60s in-memory cache). The Flutterwave webhook URL is
// stored here so it's the single source of truth: it's served on the stable
// Cloudflare tunnel host and operators paste this same URL into the
// Flutterwave dashboard. No code reads a hardcoded URL.

message GetTransferAsyncConfigRequest {}

message UpdateTransferAsyncConfigRequest {
  // Each field is optional. Omit to leave the corresponding system_setting
  // row untouched (proto3 doesn't distinguish unset bool from false, so we
  // use HasField semantics via the optional keyword).
  optional bool   async_external_transfer_enabled = 1;
  optional bool   async_batch_transfer_enabled = 2;
  optional string flutterwave_webhook_url = 3;

  // Worker tick intervals (seconds). All default to 3600 (1 h) to keep DB
  // pressure low. Admin can shorten in prod for faster recovery — the UI
  // surfaces these as sliders. The thresholds (stale_threshold,
  // rollback_max_attempts, etc.) are intentionally NOT exposed here as
  // they govern WHEN a row qualifies for pickup, not HOW OFTEN we look.
  optional int32 stale_reconciler_interval_seconds   = 10; // reconciler.transfer_stale.interval_seconds
  optional int32 rollback_processor_interval_seconds = 11; // reconciler.transfer_rollback.interval_seconds
  optional int32 hold_extension_interval_seconds     = 12; // reconciler.transfer_hold_extension.interval_seconds
  optional int32 batch_supervisor_interval_seconds   = 13; // reconciler.batch_supervisor.interval_seconds
  optional int32 batch_settlement_interval_seconds   = 14; // reconciler.batch_settlement.interval_seconds
  optional int32 batch_rollback_interval_seconds     = 15; // reconciler.batch_rollback.interval_seconds
  optional int32 batch_hold_expiry_interval_seconds  = 16; // reconciler.batch_hold_expiry.interval_seconds
}

message TransferAsyncConfig {
  // Current configured values from system_settings.
  bool   async_external_transfer_enabled = 1;
  bool   async_batch_transfer_enabled = 2;
  string flutterwave_webhook_url = 3;

  // Display-only: when an operator last saved the URL. Helps ops
  // see whether the URL in the Flutterwave dashboard is still aligned with
  // the live tunnel.
  string flutterwave_webhook_url_updated_at = 4;

  // Worker tick intervals (seconds). All default to 3600 if no DB override.
  int32 stale_reconciler_interval_seconds   = 10;
  int32 rollback_processor_interval_seconds = 11;
  int32 hold_extension_interval_seconds     = 12;
  int32 batch_supervisor_interval_seconds   = 13;
  int32 batch_settlement_interval_seconds   = 14;
  int32 batch_rollback_interval_seconds     = 15;
  int32 batch_hold_expiry_interval_seconds  = 16;
}

