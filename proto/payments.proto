  string account_number = 2;   // destination account number
}

message GetTransferSuccessPredictionResponse {
  // Bank availability: rolling-window success rate to this destination bank.
  int32  bank_availability_pct = 1;   // 0-100; 0 when band is "unknown"
  string bank_band             = 2;   // good | fair | poor | unknown
  int32  bank_sample_size      = 3;   // resolved transfers in the window

  // Recipient trust: prior successful transfers to this (bank, account).
  string recipient_trust_band       = 4;   // verified | new | caution | unknown
  int32  prior_transfer_count       = 5;   // by THIS user to the recipient
  int64  recipient_known_since_unix = 6;   // earliest platform-wide success (unix secs); 0 if none

  // Fraud signal.
  bool   blocklisted = 7;   // true if destination is on the fraud blocklist
}

// ===== SAVED BATCH DRAFTS =====
//
// A SavedBatch is a user-owned, named TEMPLATE of recipients + amounts.
// Drafts NEVER move money. ExecuteFromSavedBatch is the only path that
// turns a draft into a real transfer, and it does so by building a
// BatchTransferRequest from the draft and delegating to the existing
// (already CAS-hardened) BatchTransfer money path. The draft itself is
// left intact so the user can re-execute or keep editing.

message SavedBatchItemInput {
  // Free-form recipient category. Mirrors models.SavedBatchRecipient*:
  // "internal_lazervault" | "external_bank" | "tagpay" | "contact".
  // Used by the executor to route each item correctly. Defaults to
  // "external_bank" if blank.
  string recipient_type    = 1;
  string recipient_user_id = 2;  // populated for internal_lazervault
  string bank_code         = 3;  // populated for external_bank
  string account_number    = 4;  // bank account number or tag
  string beneficiary_name  = 5;  // resolved/verified recipient name
  double amount            = 6;  // major units (e.g. NGN)
  string narration         = 7;
  int32  sort_order        = 8;  // optional; auto-appended if 0
}

message SavedBatchItem {
  string id                = 1;
  string saved_batch_id    = 2;
  string recipient_type    = 3;
  string recipient_user_id = 4;
  string bank_code         = 5;
  string account_number    = 6;
  string beneficiary_name  = 7;
  double amount            = 8;
  string narration         = 9;
  int32  sort_order        = 10;
  string created_at        = 11;
  string updated_at        = 12;
}

message SavedBatch {
  string id                = 1;
  string user_id           = 2;
  string name              = 3;
  string currency          = 4;
  string source_account_id = 5;
  double total_amount      = 6;
  int32  item_count        = 7;
  string created_at        = 8;
  string updated_at        = 9;
  repeated SavedBatchItem items = 10;  // populated by Get / mutating ops; empty in list
}

message SaveBatchDraftRequest {
  // Name is optional — most clients fill this with a friendly label.
  string name              = 1;
  string currency          = 2;   // defaults to "NGN" if blank
  string source_account_id = 3;
  repeated SavedBatchItemInput items = 4;
}

message ListSavedBatchesRequest {
  int32 limit  = 1;   // bounded server-side (max 100, default 20)
  int32 offset = 2;
}

message ListSavedBatchesResponse {
  repeated SavedBatch batches = 1;
  int64 total                 = 2;
  int32 limit                 = 3;
  int32 offset                = 4;
}

message GetSavedBatchRequest {
  string id = 1;
}

message UpdateSavedBatchRequest {
  string id   = 1;
  string name = 2;
}

message DeleteSavedBatchRequest {
  string id = 1;
}

message DeleteSavedBatchResponse {
  bool success = 1;
}

message AddSavedBatchItemRequest {
  string saved_batch_id    = 1;
  SavedBatchItemInput item = 2;
}

message RemoveSavedBatchItemRequest {
  string saved_batch_id = 1;
  string item_id        = 2;
}

message UpdateSavedBatchItemAmountRequest {
  string saved_batch_id = 1;
  string item_id        = 2;
  double amount         = 3;
}

message ApplyCollectiveAmountRequest {
  string saved_batch_id = 1;
  // Exactly one of multiplier or amount_per_item must be set.
  // multiplier > 0 scales every item by the factor; amount_per_item
  // rewrites every item to that absolute value.
  oneof mode {
    double multiplier      = 2;
    double amount_per_item = 3;
  }
}

message ExecuteFromSavedBatchRequest {
  string saved_batch_id  = 1;
  // Required: idempotency_key is forwarded into the BatchTransfer path so a
  // double-tap on the Execute button can never charge twice.
  string idempotency_key = 2;
  // Transaction-PIN verification, same shape as BatchTransferRequest.
  string transaction_id     = 3;
  string verification_token = 4;
  // Optional: override per-item amounts at execute time (keyed by item_id).
  // Items not in the map use the saved amount. Unknown ids are ignored.
  map<string, double> per_item_overrides = 5;
  // Optional: override the source account. If unset, the active account
  // from context (x-account-id) is used — same convention as BatchTransfer.
  string source_account_id = 6;
}

