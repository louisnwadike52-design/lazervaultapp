message GetFraudDetectionSettingRequest {}
message SetFraudDetectionSettingRequest { bool enabled = 1; }
message FraudDetectionSetting { bool enabled = 1; }
message GetFraudFreezeStatusRequest {}
message FraudFreezeStatus {
  bool frozen = 1;
  string reason = 2;          // user-safe copy
  int64 amount_minor = 3;     // the transfer that tripped the freeze
  int64 limit_minor = 4;      // the learned limit it exceeded
  string blocked_at = 5;      // RFC3339
  string reference = 6;
  string blocked_id = 7;      // id of the blocked-transaction record
}
message RequestFraudUnfreezeRequest {
  // Transaction-PIN verification token (the SAME token the send-funds flow uses,
  // minted after the tx-PIN bottomsheet) + the transaction id it is bound to.
  string verification_token = 1;
  string transaction_id = 2;
}
message RequestFraudUnfreezeResponse {
  bool success = 1;
  string message = 2;
}

// ===== MODELS =====

message Payment {
  string id = 1;
  string user_id = 2;
  string account_id = 3;
  string payment_type = 4;              // "transfer", "withdraw", "deposit", "bill", "airtime"
  string reference = 5;
  double amount = 6;
  string currency = 7;
  string status = 8;                    // "pending", "completed", "failed", "reversed"
  string recipient = 9;                 // Account number, tag, or provider
  string description = 10;
  string metadata = 11;                 // JSON metadata
  string created_at = 12;
  string updated_at = 13;
}

message BillProvider {
  string id = 1;
  string name = 2;
  string type = 3;                      // "electricity", "water", "internet", "cable"
  string logo_url = 4;
  bool is_active = 5;
  double min_amount = 6;
  double max_amount = 7;
}

message AirtimeProvider {
  string id = 1;
  string name = 2;
  string network = 3;                   // "MTN", "Airtel", "Glo", "9mobile"
  string logo_url = 4;
  bool is_active = 5;
  repeated string denominations = 6;    // ["100", "200", "500", "1000"]
}

// ===== SEND FUNDS (Transfer) =====
// NOTE: user_id extracted from JWT token, not from request
message SendFundsRequest {
  string from_account_id = 1;
  string to_account_number = 2;       // Bank account number (for external transfers)
  string to_account_id = 9;           // Account UUID (for internal transfers)
  string type = 10;                    // "internal" or "external" - tells backend how to interpret the recipient identifiers
  double amount = 3;
  string description = 4;

  // Transaction PIN verification (replaces direct PIN field)
  string transaction_id = 5;           // Unique transaction identifier
  string verification_token = 6;        // Token from TransactionPinService validation

  // External transfer fields
  string destination_bank_code = 7;    // Bank code for external transfers (e.g., Flutterwave bank code)
  string beneficiary_name = 8;         // Recipient name for external transfers

  // Budget tracking
  int32 expense_category = 11;         // ExpenseCategory enum value selected by user (0 = unset)

  // Idempotency key — OPTIONAL, decoupled from transaction_id. transaction_id is
  // dual-purpose: it binds the PIN verification_token (PreValidate) AND, when this
  // field is empty, it is ALSO used as the idempotency reference. That conflation
  // is a money-safety hazard for fan-out payers who share one token-binding id
  // (e.g. every co-payer of a split bill pays with transaction_id=SPLIT-PAY-{bill}):
  // the 2nd payer's SendFunds would dedupe against the 1st's cached payment and be
  // marked paid WITHOUT a debit. When set, the service derives the idempotency
  // reference from THIS key instead of transaction_id, so each payer dedups
  // independently while the token still validates against the shared transaction_id.
  string idempotency_key = 12;
}

message SendFundsResponse {
  Payment payment = 1;
  double new_balance = 2;
  string recipient_name = 3;
  string message = 4;
}

// ===== BATCH TRANSFER =====

message BatchTransferItem {
  string to_account_number = 1;
  double amount = 2;
  string description = 3;
  string reference = 4;
  string category = 5;
  string destination_bank_code = 6;   // Bank code for external transfers (empty = internal)
  string beneficiary_name = 7;        // Verified beneficiary name
  string destination_bank_name = 8;   // Human-readable bank name
  // SendFunds parity: the recipient's account/user UUID for internal legs —
  // the stable routing identifier, resolved exactly like SendFunds'
  // to_account_id (GetAccountByID → user-UUID → primary account).
  string to_account_id = 9;
  // "internal" | "external" | "" (legacy: inferred from bank code). Explicit
  // like SendFunds' type field — an external leg skips internal lookups.
  string transfer_type = 10;
}

// NOTE: user_id extracted from JWT token, not from request
message BatchTransferRequest {
  string from_account_id = 1;
  repeated BatchTransferItem transfers = 2;

  // Transaction PIN verification (replaces direct PIN field)
  string transaction_id = 3;           // Unique transaction identifier
  string verification_token = 4;        // Token from TransactionPinService validation
}

message BatchTransferResponse {
  string batch_id = 1;
  int32 total_transfers = 2;
  int32 successful_transfers = 3;
  int32 failed_transfers = 4;
  repeated BatchTransferResultItem results = 5;
  double new_balance = 6;
  string message = 7;
  string status = 8;
  double total_amount = 9;
  double total_fee = 10;
  string created_at = 11;
  string completed_at = 12;
}

message BatchTransferResultItem {
  string transfer_id = 1;
  string status = 2;
  double amount = 3;
  double fee = 4;
  string recipient_name = 5;
  string recipient_account = 6;
  string failure_reason = 7;
  string reference = 8;
  string destination_bank_code = 9;   // Bank code (populated for external)
  string destination_bank_name = 10;  // Bank name (populated for external)
  string transfer_type = 11;          // "internal" or "external"
  string beneficiary_name = 12;       // Verified beneficiary name
  string recipient_user_id = 13;      // Resolved recipient user ID (for internal transfers)
}

// ===== WITHDRAW =====
// NOTE: user_id extracted from JWT token, not from request
message WithdrawRequest {
  string account_id = 1;
  double amount = 2;
  string description = 3;
  string location = 4;                  // ATM location or branch

  // Transaction PIN verification (replaces direct PIN field)
  string transaction_id = 5;           // Unique transaction identifier
  string verification_token = 6;        // Token from TransactionPinService validation
}

message WithdrawResponse {
  Payment payment = 1;
  double new_balance = 2;
  double available_balance = 3;
  string message = 4;
}

