message AdminGetExternalTransferFeeAuditRequest {
  string start_date = 1;  // YYYY-MM-DD (UTC, inclusive)
  string end_date   = 2;  // YYYY-MM-DD (UTC, inclusive)
  int32  limit      = 3;  // default 100, max 500
  int32  offset     = 4;
}

message ExternalTransferFeeAuditRow {
  string reference     = 1;
  int64  amount_minor  = 2;
  int64  estimate_minor = 3;  // metadata.provider_fee_minor_estimate
  int64  actual_minor  = 4;   // metadata.provider_fee_minor_actual (0 if !has_actual)
  int64  delta_minor   = 5;   // estimate - actual (+ve = over-collected)
  string status        = 6;
  string created_at    = 7;   // RFC3339
  bool   has_actual    = 8;   // false for legacy rows with no captured actual
}

message ExternalTransferFeeAuditSummary {
  int64 count                     = 1;
  int64 with_actual_count         = 2;
  int64 total_estimate_minor      = 3;
  int64 total_actual_minor        = 4;
  int64 total_overcollected_minor = 5;  // sum of +ve deltas (has_actual rows)
  int64 total_undercollected_minor = 6; // sum of -ve deltas magnitude (has_actual rows)
  int64 net_minor                 = 7;  // total_estimate - total_actual over has_actual rows
}

message AdminGetExternalTransferFeeAuditResponse {
  repeated ExternalTransferFeeAuditRow rows = 1;
  ExternalTransferFeeAuditSummary summary   = 2;
}

