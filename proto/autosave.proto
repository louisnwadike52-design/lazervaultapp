// MIRROR — DO NOT EDIT, AND DO NOT GENERATE FROM THIS FILE.
//
// The authoritative copy is services/products-gateway/proto/autosave.proto,
// and lib/src/generated/autosave.* is produced FROM THAT PATH:
//
//   cd services/products-gateway
//   PATH="$HOME/.pub-cache/bin:$PATH" protoc \
//     --dart_out=grpc:../../lazervaultapp/lib/src/generated \
//     -Iproto proto/autosave.proto
//
// Use protoc_plugin 22.5.0 — 25.x emits short BuilderInfo names (aE/aI/pPM)
// that do not exist on the protobuf 4.x this app pins, and the failure only
// shows up in a RELEASE build.
//
// WHY THE WARNING: this file sat 133 lines behind the real one, missing
// GetAutoSaveCapabilitiesRequest/Response entirely, while the committed
// generated Dart contained them. Regenerating from here would have compiled
// and silently DELETED the capabilities RPC the trigger picker depends on.
// It is kept only so the app tree shows the contract it speaks.

syntax = "proto3";

package pb;
option go_package = "lazervaultGo/pb";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Auto-save rule trigger types
enum TriggerType {
    TRIGGER_UNKNOWN = 0;
    TRIGGER_ON_DEPOSIT = 1;
    TRIGGER_SCHEDULED = 2;
    TRIGGER_ROUND_UP = 3;
    TRIGGER_EXTERNAL_INFLOW = 4;
    TRIGGER_SCHEDULED_EXTERNAL = 5; // Recurring standing-order pull from a linked bank account
}

// Schedule frequency for scheduled auto-saves
enum ScheduleFrequency {
    FREQUENCY_UNKNOWN = 0;
    FREQUENCY_DAILY = 1;
    FREQUENCY_WEEKLY = 2;
    FREQUENCY_BIWEEKLY = 3;
    FREQUENCY_MONTHLY = 4;
}

// Auto-save rule status
enum AutoSaveStatus {
    STATUS_UNKNOWN = 0;
    STATUS_ACTIVE = 1;
    STATUS_PAUSED = 2;
    STATUS_COMPLETED = 3;
    STATUS_CANCELLED = 4;
}

// Amount calculation type
enum AmountType {
    AMOUNT_UNKNOWN = 0;
    AMOUNT_FIXED = 1;
    AMOUNT_PERCENTAGE = 2;
}

// Auto-save rule definition
message AutoSaveRule {
    string id = 1;
    string user_id = 2;
    string name = 3;
    string description = 4;
    TriggerType trigger_type = 5;
    AmountType amount_type = 6;
    double amount_value = 7;
    string source_account_id = 8;
    string destination_account_id = 9;
    AutoSaveStatus status = 10;
    ScheduleFrequency frequency = 11;
    string schedule_time = 12;
    int32 schedule_day = 13;
    int32 round_up_to = 14;
    double target_amount = 15;
    double minimum_balance = 16;
    double maximum_per_save = 17;
    google.protobuf.Timestamp created_at = 18;
    google.protobuf.Timestamp updated_at = 19;
    google.protobuf.Timestamp last_triggered_at = 20;
    int32 trigger_count = 21;
    double total_saved = 22;

    // External-inflow trigger: the Mono-linked bank account that feeds this
    // rule (banking-service pulls the save via its Direct Debit mandate).
    // source_account_id is unused for TRIGGER_EXTERNAL_INFLOW.
    string source_linked_account_id = 23;
    string source_bank_name = 24;
    // Pending detected inflow awaiting the user's PIN-confirmed save. The
    // backend populates these and the app renders "₦X available — tap to
    // save", but the gateway message stopped at 24 and silently DROPPED
    // them, so that prompt could never appear (Bank Inflow's entire UX).
    // Kept (and now forwarded) so legacy paused rules display honestly.
    int64 pending_inflow_kobo = 25;
    string pending_inflow_ext_txn_id = 26;
    string pending_inflow_at = 27;
}

// Create auto-save rule request
message CreateAutoSaveRuleRequest {
    string name = 1;
    string description = 2;
    TriggerType trigger_type = 3;
    AmountType amount_type = 4;
    double amount_value = 5;
    string source_account_id = 6;
    string destination_account_id = 7;
    ScheduleFrequency frequency = 8;
    string schedule_time = 9;
    int32 schedule_day = 10;
    int32 round_up_to = 11;
    double target_amount = 12;
    double minimum_balance = 13;
    double maximum_per_save = 14;
    // Required when trigger_type is TRIGGER_EXTERNAL_INFLOW; source_account_id
    // is ignored for that trigger.
    string source_linked_account_id = 15;
    string source_bank_name = 16;
}

message CreateAutoSaveRuleResponse {
    bool success = 1;
    string msg = 2;
    AutoSaveRule rule = 3;
}

// Get auto-save rules request. Server-side filter / sort / pagination
// support so the Flutter All-Rules screen can scroll through hundreds
// of rules without loading the full collection on every interaction.
message GetAutoSaveRulesRequest {
    string account_id = 1;
    AutoSaveStatus status = 2;
    // Substring match against name + description (case-insensitive).
    string search = 3;
    // sort_by: "created_at" | "name" | "total_saved" | "last_triggered_at".
    string sort_by = 4;
    // sort_dir: "asc" | "desc". Default "desc".
    string sort_dir = 5;
    int32 limit = 6;
    int32 offset = 7;
    string trigger_type = 8;
}

message GetAutoSaveRulesResponse {
    bool success = 1;
    string msg = 2;
    repeated AutoSaveRule rules = 3;
    int32 total = 4;
    bool has_more = 5;
}

// Update auto-save rule request
message UpdateAutoSaveRuleRequest {
    string rule_id = 1;
    string name = 2;
    string description = 3;
    AmountType amount_type = 4;
    double amount_value = 5;
    ScheduleFrequency frequency = 6;
    string schedule_time = 7;
    int32 schedule_day = 8;
    int32 round_up_to = 9;
    double target_amount = 10;
    double minimum_balance = 11;
    double maximum_per_save = 12;
}

message UpdateAutoSaveRuleResponse {
    bool success = 1;
    string msg = 2;
    AutoSaveRule rule = 3;
}

// Toggle auto-save rule request
message ToggleAutoSaveRuleRequest {
    string rule_id = 1;
    string action = 2;
}

message ToggleAutoSaveRuleResponse {
    bool success = 1;
    string msg = 2;
    AutoSaveRule rule = 3;
}

// Delete auto-save rule request
message DeleteAutoSaveRuleRequest {
    string rule_id = 1;
}

message DeleteAutoSaveRuleResponse {
    bool success = 1;
    string msg = 2;
}

// Auto-save transaction record
message AutoSaveTransaction {
    string id = 1;
    string rule_id = 2;
    string user_id = 3;
    string source_account_id = 4;
    string destination_account_id = 5;
    double amount = 6;
    TriggerType trigger_type = 7;
    string trigger_reason = 8;
    bool success = 9;
    string error_message = 10;
    google.protobuf.Timestamp created_at = 11;
    // JSON context; external_inflow links the save to its banking deposit
    // ({"deposit_reference", "external_txn_id", "bank_name"}).
    string metadata = 12;
    // Platform fee (major units) deducted from the save: `amount` is the NET
    // kept, gross_amount = amount + fee.
    double fee = 13;
    double gross_amount = 14;
    string deposit_status = 15;  // ''=wallet; pending|completed|failed
    string fee_settled_at = 16;
}

// Fee quote for the rule-review + manual-save sheets. Math is server-side
// (single source with the executor) — the app never computes a fee.
message GetAutoSaveFeeQuoteRequest {
    int64 amount_kobo = 1;
    string trigger_type = 2;
}

message GetAutoSaveFeeQuoteResponse {
    bool fee_enabled = 1;
    int64 fee_kobo = 2;
    int64 net_kobo = 3;
    string fee_type = 4;
    int64 percent_bps = 5;
    int64 cap_kobo = 6;
    int64 fixed_kobo = 7;
}

// Which triggers the app may offer, read from admin settings. Asked before the
// trigger picker is drawn so a switched-off trigger is never shown; the server
// re-checks on create/resume/trigger, so this is a display hint, not the gate.
message GetAutoSaveCapabilitiesRequest {}

message GetAutoSaveCapabilitiesResponse {
    bool bank_inflow_enabled = 1;
    int64 min_save_kobo = 2;
    bool fee_enabled = 3;
    string bank_inflow_disabled_reason = 4;
    // ADMIN-TUNABLE TRIGGER COPY, keyed by the stored trigger_type
    // (on_deposit, scheduled, round_up, external_inflow, scheduled_external).
    //
    // The five trigger names and their one-line explanations were compiled
    // into the app, so renaming one — "Round-Up" to "Amount Spend", say —
    // took a store release, and the admin console described a product by a
    // name the service could not change.
    //
    // A key that is ABSENT means "use the app's built-in copy". An empty map
    // is therefore the correct response from a server that has no overrides,
    // and from an older server that does not know these fields at all, which
    // is what makes adding them safe.
    map<string, string> trigger_labels = 5;
    map<string, string> trigger_descriptions = 6;
}

// Get auto-save transactions request
message GetAutoSaveTransactionsRequest {
    string rule_id = 1;
    string account_id = 2;
    int32 limit = 3;
    int32 offset = 4;
}

message GetAutoSaveTransactionsResponse {
    bool success = 1;
    string msg = 2;
    repeated AutoSaveTransaction transactions = 3;
    int32 total_count = 4;
}

// Auto-save statistics
message AutoSaveStatistics {
    string user_id = 1;
    int32 active_rules_count = 2;
    double total_saved_all_time = 3;
    double total_saved_this_month = 4;
    double total_saved_this_week = 5;
    int32 total_transactions = 6;
    double average_save_amount = 7;
    AutoSaveRule most_active_rule = 8;
    // Rule with the highest lifetime total_saved (distinct from
    // most_active_rule which uses trigger_count).
    AutoSaveRule top_rule_by_total_saved = 9;
    // Per-status counters maintained alongside active_rules_count.
    int32 paused_rules_count = 10;
    int32 completed_rules_count = 11;
    int32 cancelled_rules_count = 12;
}

message GetAutoSaveStatisticsRequest {}

message GetAutoSaveStatisticsResponse {
    bool success = 1;
    string msg = 2;
    AutoSaveStatistics statistics = 3;
}

// Manual trigger auto-save request
message TriggerAutoSaveRequest {
    string rule_id = 1;
    double custom_amount = 2;
    string transaction_pin_token = 15;  // Pre-validated PIN token for financial security
}

message TriggerAutoSaveResponse {
    bool success = 1;
    string msg = 2;
    AutoSaveTransaction transaction = 3;
}

// AutoSave Service definition
service AutoSaveService {
    rpc CreateAutoSaveRule(CreateAutoSaveRuleRequest) returns (CreateAutoSaveRuleResponse) {
        option (google.api.http) = {
            post: "/v1/autosave/rules"
            body: "*"
        };
    }

    rpc GetAutoSaveRules(GetAutoSaveRulesRequest) returns (GetAutoSaveRulesResponse) {
        option (google.api.http) = {
            get: "/v1/autosave/rules"
        };
    }

    rpc UpdateAutoSaveRule(UpdateAutoSaveRuleRequest) returns (UpdateAutoSaveRuleResponse) {
        option (google.api.http) = {
            put: "/v1/autosave/rules/{rule_id}"
            body: "*"
        };
    }

    rpc ToggleAutoSaveRule(ToggleAutoSaveRuleRequest) returns (ToggleAutoSaveRuleResponse) {
        option (google.api.http) = {
            post: "/v1/autosave/rules/{rule_id}/toggle"
            body: "*"
        };
    }

    rpc DeleteAutoSaveRule(DeleteAutoSaveRuleRequest) returns (DeleteAutoSaveRuleResponse) {
        option (google.api.http) = {
            delete: "/v1/autosave/rules/{rule_id}"
        };
    }

    rpc GetAutoSaveTransactions(GetAutoSaveTransactionsRequest) returns (GetAutoSaveTransactionsResponse) {
        option (google.api.http) = {
            get: "/v1/autosave/transactions"
        };
    }

    rpc GetAutoSaveStatistics(GetAutoSaveStatisticsRequest) returns (GetAutoSaveStatisticsResponse) {
        option (google.api.http) = {
            get: "/v1/autosave/statistics"
        };
    }

    rpc GetAutoSaveFeeQuote(GetAutoSaveFeeQuoteRequest) returns (GetAutoSaveFeeQuoteResponse) {
        option (google.api.http) = {
            get: "/api/v1/autosave/fee-quote"
        };
    }

    rpc GetAutoSaveCapabilities(GetAutoSaveCapabilitiesRequest) returns (GetAutoSaveCapabilitiesResponse) {
        option (google.api.http) = {
            get: "/api/v1/autosave/capabilities"
        };
    }

    rpc TriggerAutoSave(TriggerAutoSaveRequest) returns (TriggerAutoSaveResponse) {
        option (google.api.http) = {
            post: "/v1/autosave/rules/{rule_id}/trigger"
            body: "*"
        };
    }
}
