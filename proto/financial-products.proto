// ===== AUTOSAVE MODELS =====

// Auto-save trigger types
enum AutoSaveTriggerType {
  AUTO_SAVE_TRIGGER_UNKNOWN = 0;
  AUTO_SAVE_TRIGGER_ON_DEPOSIT = 1;
  AUTO_SAVE_TRIGGER_SCHEDULED = 2;
  AUTO_SAVE_TRIGGER_ROUND_UP = 3;
}

// Schedule frequency for scheduled auto-saves
enum AutoSaveScheduleFrequency {
  AUTO_SAVE_FREQUENCY_UNKNOWN = 0;
  AUTO_SAVE_FREQUENCY_DAILY = 1;
  AUTO_SAVE_FREQUENCY_WEEKLY = 2;
  AUTO_SAVE_FREQUENCY_BIWEEKLY = 3;
  AUTO_SAVE_FREQUENCY_MONTHLY = 4;
}

// Auto-save rule status
enum AutoSaveRuleStatus {
  AUTO_SAVE_STATUS_UNKNOWN = 0;
  AUTO_SAVE_STATUS_ACTIVE = 1;
  AUTO_SAVE_STATUS_PAUSED = 2;
  AUTO_SAVE_STATUS_COMPLETED = 3;
  AUTO_SAVE_STATUS_CANCELLED = 4;
}

// Amount calculation type
enum AutoSaveAmountType {
  AUTO_SAVE_AMOUNT_UNKNOWN = 0;
  AUTO_SAVE_AMOUNT_FIXED = 1;
  AUTO_SAVE_AMOUNT_PERCENTAGE = 2;
}

// Auto-save rule model
message AutoSaveRule {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string description = 4;
  string trigger_type = 5;           // "on_deposit", "scheduled", "round_up"
  string amount_type = 6;            // "fixed", "percentage"
  double amount_value = 7;
  string source_account_id = 8;
  string destination_account_id = 9;
  string status = 10;                // "active", "paused", "completed", "cancelled"

  // For scheduled triggers
  string frequency = 11;             // "daily", "weekly", "biweekly", "monthly"
  string schedule_time = 12;         // HH:MM format
  int32 schedule_day = 13;

  // For round-up triggers
  int32 round_up_to = 14;

  // Goals and limits
  double target_amount = 15;
  double minimum_balance = 16;
  double maximum_per_save = 17;

  // Metadata
  string created_at = 18;
  string updated_at = 19;
  string last_triggered_at = 20;
  int32 trigger_count = 21;
  double total_saved = 22;
}

// Auto-save transaction record
message AutoSaveTransaction {
  string id = 1;
  string rule_id = 2;
  string user_id = 3;
  string source_account_id = 4;
  string destination_account_id = 5;
  double amount = 6;
  string trigger_type = 7;
  string trigger_reason = 8;
  bool success = 9;
  string error_message = 10;
  string created_at = 11;
}

// Auto-save statistics
message AutoSaveStatistics {
  string user_id = 1;
  int32 active_rules_count = 2;
  double total_saved_all_time = 3;
  double total_saved_this_month = 4;
  double total_saved_this_week = 5;
  int32 total_transactions = 6;
  double average_save_amount = 7;
  AutoSaveRule most_active_rule = 8;
  // top_rule_by_total_saved is the single rule with the highest
  // lifetime total_saved. Distinct from most_active_rule (highest
  // trigger_count) because a rare-but-large save can outscore a
  // frequent-but-tiny one. Maintained denormalized in
  // auto_save_user_stats so it doesn't require an O(N) scan.
  AutoSaveRule top_rule_by_total_saved = 9;
  // Status counters maintained alongside active_rules_count so the
  // All-Rules screen filter pills (Active / Paused / Completed)
  // can render counts without re-fetching rules in every status.
  int32 paused_rules_count = 10;
  int32 completed_rules_count = 11;
  int32 cancelled_rules_count = 12;
}

// ===== AUTOSAVE REQUESTS/RESPONSES =====

// Create auto-save rule
message CreateAutoSaveRuleRequest2 {
  string name = 1;
  string description = 2;
  string trigger_type = 3;
  string amount_type = 4;
  double amount_value = 5;
  string source_account_id = 6;
  string destination_account_id = 7;
  string frequency = 8;
  string schedule_time = 9;
  int32 schedule_day = 10;
  int32 round_up_to = 11;
  double target_amount = 12;
  double minimum_balance = 13;
  double maximum_per_save = 14;
}

message CreateAutoSaveRuleResponse2 {
  AutoSaveRule rule = 1;
  string message = 2;
}

// Get auto-save rules. Server-side filter / sort / pagination so the
// Flutter All-Rules screen can scroll through hundreds of rules
// without loading the full set on every interaction.
message GetAutoSaveRulesRequest2 {
  string account_id = 1;
  string status = 2;
  // Substring match against name + description (case-insensitive).
  // Empty string means "no search".
  string search = 3;
  // sort_by: one of "created_at", "name", "total_saved",
  // "last_triggered_at". Defaults to "created_at" when empty.
  string sort_by = 4;
  // sort_dir: "asc" or "desc". Defaults to "desc" when empty.
  string sort_dir = 5;
  // limit: maximum rows to return. Server caps this at 100; the
  // typical page size for the Flutter list is 25.
  int32 limit = 6;
  // offset: classical OFFSET pagination. Combined with the
  // (user_id, sort_field) covering indexes from migration 018 this
  // stays cheap for the depths users actually scroll to.
  int32 offset = 7;
  // trigger_type: optional filter (scheduled / on_deposit / round_up).
  string trigger_type = 8;
}

message GetAutoSaveRulesResponse2 {
  repeated AutoSaveRule rules = 1;
  int32 total = 2;
  // has_more is convenience: clients can keep paging until this is
  // false instead of comparing offset+len(rules) vs total.
  bool has_more = 3;
}

// Update auto-save rule
message UpdateAutoSaveRuleRequest2 {
  string rule_id = 1;
  string name = 2;
  string description = 3;
  string amount_type = 4;
  double amount_value = 5;
  string frequency = 6;
  string schedule_time = 7;
  int32 schedule_day = 8;
  int32 round_up_to = 9;
  double target_amount = 10;
  double minimum_balance = 11;
  double maximum_per_save = 12;
}

message UpdateAutoSaveRuleResponse2 {
  AutoSaveRule rule = 1;
  string message = 2;
}

// Toggle auto-save rule (pause/resume)
message ToggleAutoSaveRuleRequest2 {
  string rule_id = 1;
  string action = 2;  // "pause" or "resume"
}

message ToggleAutoSaveRuleResponse2 {
  AutoSaveRule rule = 1;
  string message = 2;
}

// Delete auto-save rule
message DeleteAutoSaveRuleRequest2 {
  string rule_id = 1;
}

message DeleteAutoSaveRuleResponse2 {
  bool success = 1;
  string message = 2;
}

// Get auto-save transactions
message GetAutoSaveTransactionsRequest2 {
  string rule_id = 1;
  string account_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetAutoSaveTransactionsResponse2 {
  repeated AutoSaveTransaction transactions = 1;
  int32 total = 2;
}

// Get auto-save statistics
message GetAutoSaveStatisticsRequest2 {}

message GetAutoSaveStatisticsResponse2 {
  AutoSaveStatistics statistics = 1;
}

// Trigger auto-save manually
message TriggerAutoSaveRequest2 {
  string rule_id = 1;
  double custom_amount = 2;
  string transaction_pin_token = 4;  // Pre-validated PIN token for financial security
}

message TriggerAutoSaveResponse2 {
  AutoSaveTransaction transaction = 1;
  string message = 2;
}

// ===== NOTIFICATION CHANNEL MODELS =====

// Notification channel types
enum NotificationChannelType {
  NOTIFICATION_CHANNEL_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_TYPE_TELEGRAM = 1;
  NOTIFICATION_CHANNEL_TYPE_DISCORD = 2;
  NOTIFICATION_CHANNEL_TYPE_WHATSAPP_BUSINESS = 3;
  NOTIFICATION_CHANNEL_TYPE_SLACK = 4;
}

// Notification channel status
enum NotificationChannelStatus {
  NOTIFICATION_CHANNEL_STATUS_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_STATUS_PENDING = 1;      // Awaiting verification
  NOTIFICATION_CHANNEL_STATUS_ACTIVE = 2;       // Verified and active
  NOTIFICATION_CHANNEL_STATUS_PAUSED = 3;       // Temporarily paused
  NOTIFICATION_CHANNEL_STATUS_ERROR = 4;        // Error state (e.g., bot removed)
  NOTIFICATION_CHANNEL_STATUS_DISCONNECTED = 5; // Manually disconnected
}

// Notification event types
enum NotificationEventType {
  NOTIFICATION_EVENT_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_EVENT_TYPE_NEW_DONATION = 1;           // When someone donates
  NOTIFICATION_EVENT_TYPE_MILESTONE_REACHED = 2;      // 25%, 50%, 75%, 100%
  NOTIFICATION_EVENT_TYPE_GOAL_REACHED = 3;           // Campaign fully funded
  NOTIFICATION_EVENT_TYPE_NEW_CONTRIBUTOR = 4;        // First-time contributor
  NOTIFICATION_EVENT_TYPE_LARGE_DONATION = 5;         // Donation above threshold
  NOTIFICATION_EVENT_TYPE_DAILY_SUMMARY = 6;          // Daily progress summary
  NOTIFICATION_EVENT_TYPE_CAMPAIGN_ENDING = 7;        // Campaign ending soon
  NOTIFICATION_EVENT_TYPE_CAMPAIGN_ENDED = 8;         // Campaign ended
  NOTIFICATION_EVENT_TYPE_WITHDRAWAL = 9;             // Creator withdrew funds
}

// Notification channel model
message NotificationChannel {
  string id = 1;
  string crowdfund_id = 2;
  string creator_user_id = 3;
  NotificationChannelType channel_type = 4;
  NotificationChannelStatus status = 5;
  string channel_name = 6;              // Display name (e.g., "My Telegram Group")
  string channel_identifier = 7;        // Platform-specific ID (chat_id, webhook_url, etc.)
  string channel_username = 8;          // @username for Telegram/Discord
  repeated NotificationEventType enabled_events = 9;
  NotificationPreferences preferences = 10;
  string last_notification_at = 11;
  int32 notification_count = 12;
  int32 failure_count = 13;
  string last_error = 14;
  string created_at = 15;
  string updated_at = 16;
}

// Notification preferences for a channel
message NotificationPreferences {
  bool include_donor_name = 1;          // Show donor name (if not anonymous)
  bool include_amount = 2;              // Show donation amount
  bool include_message = 3;             // Show donor's message
  bool include_progress = 4;            // Show campaign progress
  bool include_leaderboard = 5;         // Show top contributors
  double large_donation_threshold = 6;  // Threshold for large donation alerts
  string message_template = 7;          // Custom message template (optional)
  string language = 8;                  // Preferred language (en, fr, etc.)
  bool quiet_hours_enabled = 9;         // Enable quiet hours
  string quiet_hours_start = 10;        // Start time (HH:MM)
  string quiet_hours_end = 11;          // End time (HH:MM)
  string timezone = 12;                 // User timezone
}

// Notification delivery record
message NotificationDelivery {
  string id = 1;
  string channel_id = 2;
  string crowdfund_id = 3;
  NotificationEventType event_type = 4;
  string event_data = 5;                // JSON: donation details, milestone info, etc.
  string message_content = 6;           // Actual message sent
  bool success = 7;
  string error_message = 8;
  int32 retry_count = 9;
  string platform_message_id = 10;      // Message ID from platform
  string created_at = 11;
  string delivered_at = 12;
}

// ===== NOTIFICATION CHANNEL REQUESTS/RESPONSES =====

// Connect notification channel
message ConnectNotificationChannelRequest {
  string crowdfund_id = 1;
  NotificationChannelType channel_type = 2;
  string channel_name = 3;
  // Platform-specific connection data
  oneof connection_data {
    TelegramConnectionData telegram = 4;
    DiscordConnectionData discord = 5;
    WhatsAppBusinessConnectionData whatsapp_business = 6;
    SlackConnectionData slack = 7;
  }
  repeated NotificationEventType enabled_events = 8;
  NotificationPreferences preferences = 9;
}

message TelegramConnectionData {
  string chat_id = 1;                   // Group/channel chat ID
  string verification_code = 2;         // Code sent by bot to verify
}

message DiscordConnectionData {
  string webhook_url = 1;               // Discord webhook URL
  string server_name = 2;               // Server name for display
  string channel_name = 3;              // Channel name for display
}

message WhatsAppBusinessConnectionData {
  string phone_number_id = 1;           // WhatsApp Business phone number ID
  string access_token = 2;              // Meta access token
  string recipient_id = 3;              // Group or broadcast list ID
}

message SlackConnectionData {
  string webhook_url = 1;               // Slack incoming webhook URL
  string workspace_name = 2;            // Workspace name for display
  string channel_name = 3;              // Channel name for display
}

message ConnectNotificationChannelResponse {
  NotificationChannel channel = 1;
  bool requires_verification = 2;       // True for Telegram (need bot verification)
  string verification_instructions = 3; // Instructions for verification
  string message = 4;
}

// Disconnect notification channel
message DisconnectNotificationChannelRequest {
  string channel_id = 1;
}

message DisconnectNotificationChannelResponse {
  bool success = 1;
  string message = 2;
}

// Get notification channels
message GetNotificationChannelsRequest {
  string crowdfund_id = 1;
}

message GetNotificationChannelsResponse {
  repeated NotificationChannel channels = 1;
}

// Update notification channel
message UpdateNotificationChannelRequest {
  string channel_id = 1;
  string channel_name = 2;
  repeated NotificationEventType enabled_events = 3;
  NotificationPreferences preferences = 4;
  NotificationChannelStatus status = 5;   // For pause/resume
}

message UpdateNotificationChannelResponse {
  NotificationChannel channel = 1;
  string message = 2;
}

// Test notification channel
message TestNotificationChannelRequest {
  string channel_id = 1;
}

message TestNotificationChannelResponse {
  bool success = 1;
  string message = 2;
  string platform_message_id = 3;
}

// Get Telegram bot info
message GetTelegramBotInfoRequest {}

message GetTelegramBotInfoResponse {
  string bot_username = 1;              // @YourBotName
  string bot_name = 2;                  // Display name
  string bot_link = 3;                  // t.me/YourBotName
  string instructions = 4;              // How to add bot to group
}

// Verify Telegram channel
message VerifyTelegramChannelRequest {
  string crowdfund_id = 1;
  string chat_id = 2;
  string verification_code = 3;
}

message VerifyTelegramChannelResponse {
  bool success = 1;
  NotificationChannel channel = 2;
  string message = 3;
}

// Get notification history
message GetNotificationHistoryRequest {
  string crowdfund_id = 1;
  string channel_id = 2;                // Optional: filter by channel
  int32 page = 3;
  int32 page_size = 4;
}

message GetNotificationHistoryResponse {
  repeated NotificationDelivery deliveries = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  bool has_more = 5;
}

