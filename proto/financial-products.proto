// ===== WITHDRAW FROM CROWDFUND =====

// NOTE: user_id extracted from JWT token, not from request
message WithdrawFromCrowdfundRequest {
  string crowdfund_id = 1;
  double amount = 2;
  string pin = 3;
  // Destination account for withdrawal - one of the following must be specified:
  // If destination_account_id is set, funds go to that specific account
  // If destination_account_type is set, funds go to user's account of that type
  // If neither is set, funds go to user's primary account
  string destination_account_id = 4;    // Optional: specific account UUID
  string destination_account_type = 5;  // Optional: "personal", "savings", or "investment"
  // transaction_id MUST match the value the client used when minting
  // the PIN verification token. Same fix as ContributeToCrowdfund —
  // the auth-service token validator looks up by
  // (token, user_id, transaction_id), so the two MUST agree exactly.
  string transaction_id = 6;
}

message WithdrawFromCrowdfundResponse {
  Crowdfund crowdfund = 1;
  double amount_withdrawn = 2;
  string message = 3;
  string destination_account_id = 4;    // Account where funds were credited
  double destination_new_balance = 5;   // New balance of destination account (in kobo)
  // Fee snapshot. Zero / empty when no platform commission was
  // applied. amount_withdrawn always reflects the GROSS the user
  // requested; net_amount is what landed in their destination
  // account, fee_amount is what was credited to the platform
  // revenue wallet.
  double fee_amount = 6;
  double net_amount = 7;
  string fee_type = 8;          // ""|"flat"|"percentage"
  int32 fee_basis_points = 9;   // populated when fee_type == "percentage"
  int64 fee_fixed_kobo = 10;    // populated when fee_type == "flat"
}

message GetCrowdfundWithdrawalFeeQuoteRequest {
  string crowdfund_id = 1;
  double amount = 2;
}

message GetCrowdfundWithdrawalFeeQuoteResponse {
  double gross_amount = 1;
  double fee_amount = 2;
  double net_amount = 3;
  string currency = 4;
  bool fee_enabled = 5;
  string fee_type = 6;          // ""|"flat"|"percentage"
  int32 fee_basis_points = 7;   // when fee_type == "percentage"
  int64 fee_fixed_kobo = 8;     // when fee_type == "flat"
}

