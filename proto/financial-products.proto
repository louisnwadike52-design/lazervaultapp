message CrowdfundCustomCategory {
  string id = 1;
  string name = 2;
  string created_at = 3; // RFC3339
}

message ListCrowdfundCustomCategoriesRequest {}

message ListCrowdfundCustomCategoriesResponse {
  repeated CrowdfundCustomCategory categories = 1;
}

message AddCrowdfundCustomCategoryRequest {
  // Display name (trimmed server-side, max 64 chars). The unique
  // index dedupes case-insensitively, so "music" and "Music" map
  // to a single row.
  string name = 1;
}

message AddCrowdfundCustomCategoryResponse {
  CrowdfundCustomCategory category = 1;
  // True when the row was freshly created on this call. False when
  // a case-insensitive match already existed (the response still
  // returns that row so the client can select it).
  bool created = 2;
}

message DeleteCrowdfundCustomCategoryRequest {
  string category_id = 1;
}

message DeleteCrowdfundCustomCategoryResponse {
  bool deleted = 1;
}

// ===== CROWDFUND WITHDRAWAL AUDIT (admin / per-creator history) =====

message CrowdfundWithdrawalRecord {
  string id = 1;
  string crowdfund_id = 2;
  string user_id = 3;
  double amount = 4;
  string currency = 5;
  string destination_account_id = 6;
  string destination_account_type = 7;
  string idempotency_key = 8;
  string status = 9;            // pending|completed|failed|reversed
  double balance_before = 10;
  double balance_after = 11;
  string notes = 12;
  string created_at = 13;       // RFC3339
  // Fee snapshot frozen at withdrawal time so historical records
  // are reproducible without re-reading current system_settings.
  double fee_amount = 14;
  double net_amount = 15;
  string fee_type = 16;
  int32 fee_basis_points = 17;
  int64 fee_fixed_kobo = 18;
}

message ListCrowdfundWithdrawalsRequest {
  // Filters; any combination is supported. Authorization is enforced
  // server-side: non-admins only see rows where user_id == caller.
  string crowdfund_id = 1;
  string user_id = 2;
  string status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListCrowdfundWithdrawalsResponse {
  repeated CrowdfundWithdrawalRecord withdrawals = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  bool has_more = 5;
}

