// ===== MYCOVER.AI INSURANCE MARKETPLACE =====

// MyCover.ai product form field definition
message MarketplaceProductFormField {
  string name = 1;
  string label = 2;
  string type = 3;                        // "text", "number", "date", "select", "boolean", "email", "phone"
  bool required = 4;
  repeated string options = 5;
  string default_value = 6;
  string validation_regex = 7;
  string placeholder = 8;
  string description = 9;
  // utility_id is the MyCover.ai utility-list UUID that powers this
  // field's options when the values come from
  // /v2/products/utility/{id}. Non-empty implies type == "select"
  // and Flutter should fetch options from that endpoint instead of
  // using the static `options` array.
  string utility_id = 10;
  // depends_on is the name of another field whose value scopes this
  // field's utility query (e.g. vehicle_model depends on
  // vehicle_make). Empty for independent selects.
  string depends_on = 11;
  // item_fields describes the per-item sub-fields of a structured
  // (object-per-item) array field — e.g. benefit_details items are
  // {benefit(select), sum_insured(number)} while item_details items
  // are {name, value, quantity, image_url, description}. Empty for
  // non-array fields and for array fields where the client should use
  // the default cargo item shape.
  repeated MarketplaceProductFormItemField item_fields = 12;
}

// One sub-field of a structured-array item (see
// MarketplaceProductFormField.item_fields).
message MarketplaceProductFormItemField {
  string name = 1;
  string label = 2;
  string type = 3;          // "text" | "number" | "monetary" | "select" | "image"
  bool required = 4;
  repeated string options = 5;
  string placeholder = 6;
}

// MyCover.ai insurance product
message MarketplaceInsuranceProduct {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;                    // "auto", "health", "travel", "gadget", "home", "life", "package", "content"
  string provider_name = 5;
  string provider_logo = 6;
  double min_premium = 7;                 // User-facing price (includes margin)
  double max_premium = 8;                 // User-facing price (includes margin)
  string currency = 9;
  repeated string benefits = 10;
  string terms_url = 11;
  map<string, string> metadata = 12;
  repeated MarketplaceProductFormField form_fields = 13;
  bool is_active = 14;
  string purchase_route = 15;             // Provider-specific route: "leadway/buy-third-party"
  string provider_id = 16;               // MyCover provider UUID
  double base_price = 17;                // Original MyCover price before margin
  string how_it_works = 18;              // HTML how-it-works text
  string full_benefits = 19;             // HTML benefits text
  bool is_renewable = 20;
  bool is_claimable = 21;
}

// Insurance category metadata
message MarketplaceInsuranceCategory {
  string id = 1;
  string name = 2;
  string icon = 3;
  string description = 4;
  int32 product_count = 5;
}

// Quote result
message MarketplaceInsuranceQuote {
  string quote_id = 1;
  string product_id = 2;
  double premium = 3;
  string currency = 4;
  string coverage_summary = 5;
  repeated string coverage_items = 6;
  string valid_until = 7;
  map<string, string> quote_details = 8;
}

// Purchase result
message MarketplaceInsurancePurchaseResult {
  string policy_id = 1;
  string policy_number = 2;
  string reference = 3;
  string status = 4;                      // "completed", "pending", "failed"
  string provider_reference = 5;
  Insurance insurance = 6;
  string certificate_url = 7;             // Provider-issued PDF cert (may be empty for async)
  double premium = 8;                     // Confirmed premium (major units, e.g. NGN)
  string currency = 9;                    // ISO 4217, typically "NGN"
  double coverage_amount = 10;            // Sum insured, where surfaced
  string start_date = 11;                 // ISO-8601 policy start
  string end_date = 12;                   // ISO-8601 policy end
}

