// ===== CANCEL CROWDFUND (with auto-refund) =====

// NOTE: initiator_user_id extracted from JWT token. initiated_by is
// inferred by the handler (creator if owner; admin if reached via
// admin-gateway with operator JWT).
message CancelCrowdfundRequest {
  string crowdfund_id = 1;
  string reason = 2;                    // Required; ≥10 chars enforced server-side
  // PIN token required for the creator path (refund is a money
  // movement). Empty when called by the admin path.
  string transaction_pin = 3;
  string transaction_id = 4;
  // Admin override: when true and wallet < pledged, refunds are
  // queued pro-rata using the available balance. Ignored on the
  // creator path. Defaults to false.
  bool   force_partial_refund = 5;
}

