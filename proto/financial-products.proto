syntax = "proto3";

package financialproducts;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "financial-products-service/proto";

// Financial Products Service - Group accounts, insurance, and crowdfunding
service FinancialProductsService {
  // === GROUP ACCOUNT OPERATIONS ===

  // Create group savings account (groupAccount from AppServiceName)
  rpc CreateGroupAccount(CreateGroupAccountRequest) returns (CreateGroupAccountResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/creategroupaccount"
      body: "*"
    };
  }

  // Get group accounts
  rpc GetGroupAccounts(GetGroupAccountsRequest) returns (GetGroupAccountsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/groupaccounts"
    };
  }

  // Get specific group account
  rpc GetGroupAccount(GetGroupAccountRequest) returns (GetGroupAccountResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/groupaccount"
    };
  }

  // Add member to group
  rpc AddGroupMember(AddGroupMemberRequest) returns (AddGroupMemberResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/addgroupmember"
      body: "*"
    };
  }

  // Remove member from group
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (RemoveGroupMemberResponse) {
    option (google.api.http) = {
      delete: "/api/v1/products/groupmember"
    };
  }

  // Contribute to group account
  rpc ContributeToGroup(ContributeToGroupRequest) returns (ContributeToGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/contributetogroup"
      body: "*"
    };
  }

  // Withdraw from group account
  rpc WithdrawFromGroup(WithdrawFromGroupRequest) returns (WithdrawFromGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/withdrawfromgroup"
      body: "*"
    };
  }

  // Close group account
  rpc CloseGroupAccount(CloseGroupAccountRequest) returns (CloseGroupAccountResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/closegroupaccount"
      body: "*"
    };
  }

  // === INSURANCE OPERATIONS ===

  // Buy insurance policy (insurance from AppServiceName)
  rpc BuyInsurance(BuyInsuranceRequest) returns (BuyInsuranceResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/buyinsurance"
      body: "*"
    };
  }

  // Get insurance policies
  rpc GetInsurancePolicies(GetInsurancePoliciesRequest) returns (GetInsurancePoliciesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurancepolicies"
    };
  }

  // Get specific insurance policy
  rpc GetInsurancePolicy(GetInsurancePolicyRequest) returns (GetInsurancePolicyResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurancepolicy"
    };
  }

  // Make insurance claim
  rpc MakeInsuranceClaim(MakeInsuranceClaimRequest) returns (MakeInsuranceClaimResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/makeinsuranceclaim"
      body: "*"
    };
  }

  // Cancel insurance policy
  rpc CancelInsurance(CancelInsuranceRequest) returns (CancelInsuranceResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/cancelinsurance"
      body: "*"
    };
  }

  // Get available insurance plans
  rpc GetInsurancePlans(GetInsurancePlansRequest) returns (GetInsurancePlansResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insuranceplans"
    };
  }

  // === MYCOVER.AI INSURANCE MARKETPLACE ===

  // Get insurance products from MyCover.ai
  rpc GetInsuranceMarketplaceProducts(GetInsuranceMarketplaceProductsRequest) returns (GetInsuranceMarketplaceProductsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/marketplace/products"
    };
  }

  // Get insurance categories
  rpc GetInsuranceMarketplaceCategories(GetInsuranceMarketplaceCategoriesRequest) returns (GetInsuranceMarketplaceCategoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/marketplace/categories"
    };
  }

  // Get insurance quote
  rpc GetInsuranceQuote(GetInsuranceQuoteRequest) returns (GetInsuranceQuoteResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/marketplace/quote"
      body: "*"
    };
  }

  // Purchase insurance via MyCover.ai
  rpc PurchaseMarketplaceInsurance(PurchaseMarketplaceInsuranceRequest) returns (PurchaseMarketplaceInsuranceResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/marketplace/purchase"
      body: "*"
    };
  }

  // Get insurance purchase status
  rpc GetInsurancePurchaseStatus(GetInsurancePurchaseStatusRequest) returns (GetInsurancePurchaseStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/marketplace/purchase/status"
    };
  }

  // Upload file for insurance documents (ID, proof of purchase, claim evidence)
  rpc UploadInsuranceDocument(UploadInsuranceDocumentRequest) returns (UploadInsuranceDocumentResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/upload-document"
      body: "*"
    };
  }

  // Pre-construct a deterministic public URL for an insurance document
  // BEFORE the bytes are uploaded. See backend proto for details — the
  // Flutter cubit calls this on file stage and stamps public_url into
  // form_data immediately.
  rpc GetInsuranceDocumentUploadURL(GetInsuranceDocumentUploadURLRequest) returns (GetInsuranceDocumentUploadURLResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/document-upload-url"
      body: "*"
    };
  }

  // Get auxiliary data (states, vehicle makes, vehicle models, genders, etc.)
  rpc GetInsuranceAuxiliaryData(GetInsuranceAuxiliaryDataRequest) returns (GetInsuranceAuxiliaryDataResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/auxiliary/{utility_id}"
    };
  }

  // === INSURANCE PAYMENT & CLAIMS MANAGEMENT ===

  // Get payments for a specific policy
  rpc GetInsurancePayments(GetInsurancePaymentsRequest) returns (GetInsurancePaymentsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/payments"
    };
  }

  // Get all user insurance payments
  rpc GetUserInsurancePayments(GetUserInsurancePaymentsRequest) returns (GetUserInsurancePaymentsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/payments/all"
    };
  }

  // Create insurance payment record
  rpc CreateInsurancePayment(CreateInsurancePaymentRequest) returns (CreateInsurancePaymentResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/payment"
      body: "*"
    };
  }

  // Process a pending insurance payment
  rpc ProcessInsurancePayment(ProcessInsurancePaymentRequest) returns (ProcessInsurancePaymentResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/payment/process"
      body: "*"
    };
  }

  // Get a specific payment by ID
  rpc GetInsurancePaymentById(GetInsurancePaymentByIdRequest) returns (GetInsurancePaymentByIdResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/payment"
    };
  }

  // Get overdue insurance payments
  rpc GetOverdueInsurancePayments(GetOverdueInsurancePaymentsRequest) returns (GetOverdueInsurancePaymentsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/payments/overdue"
    };
  }

  // Get claims for a specific policy
  rpc GetInsuranceClaims(GetInsuranceClaimsRequest) returns (GetInsuranceClaimsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/claims"
    };
  }

  // Get all user insurance claims
  rpc GetUserInsuranceClaims(GetUserInsuranceClaimsRequest) returns (GetUserInsuranceClaimsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/claims/all"
    };
  }

  // Update an insurance claim
  rpc UpdateInsuranceClaim(UpdateInsuranceClaimRequest) returns (UpdateInsuranceClaimResponse) {
    option (google.api.http) = {
      put: "/api/v1/products/insurance/claim"
      body: "*"
    };
  }

  // Get a specific claim by ID
  rpc GetInsuranceClaimById(GetInsuranceClaimByIdRequest) returns (GetInsuranceClaimByIdResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/claim"
    };
  }

  // Update insurance policy details
  rpc UpdateInsurancePolicy(UpdateInsurancePolicyRequest) returns (UpdateInsurancePolicyResponse) {
    option (google.api.http) = {
      put: "/api/v1/products/insurance/policy"
      body: "*"
    };
  }

  // Generate payment receipt
  rpc GenerateInsuranceReceipt(GenerateInsuranceReceiptRequest) returns (GenerateInsuranceReceiptResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/receipt"
      body: "*"
    };
  }

  // Get user insurance receipts
  rpc GetUserInsuranceReceipts(GetUserInsuranceReceiptsRequest) returns (GetUserInsuranceReceiptsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/receipts"
    };
  }

  // Get insurance statistics
  rpc GetInsuranceStatistics(GetInsuranceStatisticsRequest) returns (GetInsuranceStatisticsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/statistics"
    };
  }

  // Get insurance payment statistics
  rpc GetInsurancePaymentStatistics(GetInsurancePaymentStatisticsRequest) returns (GetInsurancePaymentStatisticsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/payment-statistics"
    };
  }

  // === MYCOVER.AI MANAGEMENT APIs ===

  // Get MyCover customers
  rpc GetMyCoverCustomers(GetMyCoverCustomersRequest) returns (GetMyCoverCustomersResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/customers"
    };
  }

  // Get specific MyCover customer
  rpc GetMyCoverCustomerById(GetMyCoverCustomerByIdRequest) returns (GetMyCoverCustomerByIdResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/customer/{customer_id}"
    };
  }

  // Get policies for a specific customer
  rpc GetMyCoverCustomerPolicies(GetMyCoverCustomerPoliciesRequest) returns (GetMyCoverCustomerPoliciesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/customer/{customer_id}/policies"
    };
  }

  // Get purchases for a specific customer
  rpc GetMyCoverCustomerPurchases(GetMyCoverCustomerPurchasesRequest) returns (GetMyCoverCustomerPurchasesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/customer/{customer_id}/purchases"
    };
  }

  // Get all MyCover purchases
  rpc GetMyCoverPurchases(GetMyCoverPurchasesRequest) returns (GetMyCoverPurchasesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/purchases"
    };
  }

  // Get specific MyCover purchase by ID
  rpc GetMyCoverPurchaseById(GetMyCoverPurchaseByIdRequest) returns (GetMyCoverPurchaseByIdResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/purchase/{purchase_id}"
    };
  }

  // Get MyCover provider claims (from MyCover API, not local DB)
  rpc GetMyCoverClaims(GetMyCoverClaimsRequest) returns (GetMyCoverClaimsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/mycover/claims"
    };
  }

  // Get specific MyCover provider claim by ID
  rpc GetMyCoverClaimById(GetMyCoverClaimByIdRequest) returns (GetMyCoverClaimByIdResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/mycover/claim/{claim_id}"
    };
  }

  // File a credit-life claim
  rpc FileCreditLifeClaim(FileCreditLifeClaimRequest) returns (FileCreditLifeClaimResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/claims/credit-life"
      body: "*"
    };
  }

  // Get Nigerian states (auxiliary)
  rpc GetInsuranceStates(GetInsuranceStatesRequest) returns (GetInsuranceStatesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/auxiliary/states"
    };
  }

  // Get vehicle makes (auxiliary)
  rpc GetInsuranceVehicleMakes(GetInsuranceVehicleMakesRequest) returns (GetInsuranceVehicleMakesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/auxiliary/vehicle-makes"
    };
  }

  // Get notification preferences
  rpc GetMyCoverNotificationPreferences(GetMyCoverNotificationPreferencesRequest) returns (GetMyCoverNotificationPreferencesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/notifications/preferences"
    };
  }

  // Update notification preferences
  rpc UpdateMyCoverNotificationPreferences(UpdateMyCoverNotificationPreferencesRequest) returns (UpdateMyCoverNotificationPreferencesResponse) {
    option (google.api.http) = {
      put: "/api/v1/products/insurance/notifications/preferences"
      body: "*"
    };
  }

  // === WALLET & REFUND OPERATIONS ===

  // Get MyCover wallet balance
  rpc GetMyCoverWalletBalance(GetMyCoverWalletBalanceRequest) returns (GetMyCoverWalletBalanceResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/wallet/balance"
    };
  }

  // Request insurance refund for a cancelled policy
  rpc RequestInsuranceRefund(RequestInsuranceRefundRequest) returns (RequestInsuranceRefundResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/insurance/refund"
      body: "*"
    };
  }

  // Get insurance refund status
  rpc GetInsuranceRefundStatus(GetInsuranceRefundStatusRequest) returns (GetInsuranceRefundStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/insurance/refund/{policy_reference}"
    };
  }

  // === ADMIN RECONCILIATION & MANAGEMENT ===

  rpc GetInsuranceReconciliationOverview(GetInsuranceReconciliationOverviewRequest) returns (GetInsuranceReconciliationOverviewResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/insurance/reconciliation/overview"
    };
  }

  rpc GetOrphanedInsuranceTransactions(GetOrphanedInsuranceTransactionsRequest) returns (GetOrphanedInsuranceTransactionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/insurance/reconciliation/orphaned"
    };
  }

  rpc ManualReconcilePurchase(ManualReconcilePurchaseRequest) returns (ManualReconcilePurchaseResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/insurance/reconciliation/reconcile"
      body: "*"
    };
  }

  rpc AdminTriggerRefund(AdminTriggerRefundRequest) returns (AdminTriggerRefundResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/insurance/refund/trigger"
      body: "*"
    };
  }

  rpc GetInsuranceWebhookEvents(GetInsuranceWebhookEventsRequest) returns (GetInsuranceWebhookEventsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/insurance/webhooks/events"
    };
  }

  rpc RetryFailedWebhookEvent(RetryFailedWebhookEventRequest) returns (RetryFailedWebhookEventResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/insurance/webhooks/retry"
      body: "*"
    };
  }

  rpc GetFailedInsuranceTransactions(GetFailedInsuranceTransactionsRequest) returns (GetFailedInsuranceTransactionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/insurance/transactions/failed"
    };
  }

  rpc UpdateProductMargin(UpdateProductMarginRequest) returns (UpdateProductMarginResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/insurance/products/margin"
      body: "*"
    };
  }

  rpc GetInsurancePlatformWallets(GetInsurancePlatformWalletsRequest) returns (GetInsurancePlatformWalletsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/insurance/wallets/platform"
    };
  }

  // === CROWDFUNDING OPERATIONS ===

  // Create crowdfund campaign (crowdfund from AppServiceName)
  rpc CreateCrowdfund(CreateCrowdfundRequest) returns (CreateCrowdfundResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/createcrowdfund"
      body: "*"
    };
  }

  // Get crowdfund campaigns
  rpc GetCrowdfunds(GetCrowdfundsRequest) returns (GetCrowdfundsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfunds"
    };
  }

  // Get specific crowdfund campaign
  rpc GetCrowdfund(GetCrowdfundRequest) returns (GetCrowdfundResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund"
    };
  }

  // Contribute to crowdfund
  rpc ContributeToCrowdfund(ContributeToCrowdfundRequest) returns (ContributeToCrowdfundResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/contributetocrowdfund"
      body: "*"
    };
  }

  // Withdraw from crowdfund (creator only)
  rpc WithdrawFromCrowdfund(WithdrawFromCrowdfundRequest) returns (WithdrawFromCrowdfundResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/withdrawfromcrowdfund"
      body: "*"
    };
  }

  // Quote the platform fee + net amount for a hypothetical withdrawal
  // without touching balances. The Flutter sheet calls this on every
  // amount change so the user sees the breakdown before confirming
  // their PIN. Uses the same precedence rule as the actual withdrawal:
  // flat fee overrides margin when both are configured, otherwise the
  // single configured value applies.
  rpc GetCrowdfundWithdrawalFeeQuote(GetCrowdfundWithdrawalFeeQuoteRequest) returns (GetCrowdfundWithdrawalFeeQuoteResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/withdrawal/fee-quote"
    };
  }

  // User-scoped custom categories. The seven built-in categories
  // (Medical, Education, ...) live in the Flutter client; this RPC
  // only persists what the user has added themselves so a refreshed
  // wizard rehydrates the same chip list.
  rpc ListCrowdfundCustomCategories(ListCrowdfundCustomCategoriesRequest) returns (ListCrowdfundCustomCategoriesResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/categories/custom"
    };
  }
  rpc AddCrowdfundCustomCategory(AddCrowdfundCustomCategoryRequest) returns (AddCrowdfundCustomCategoryResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/crowdfund/categories/custom"
      body: "*"
    };
  }
  rpc DeleteCrowdfundCustomCategory(DeleteCrowdfundCustomCategoryRequest) returns (DeleteCrowdfundCustomCategoryResponse) {
    option (google.api.http) = {
      delete: "/api/v1/products/crowdfund/categories/custom/{category_id}"
    };
  }

  // List crowdfund withdrawals (audit trail). Caller filters by
  // crowdfund_id (campaign-scoped history), user_id (per-creator), or
  // neither (admin global view). Authorization is enforced by the
  // handler — non-admins only see rows where user_id == self.
  rpc ListCrowdfundWithdrawals(ListCrowdfundWithdrawalsRequest) returns (ListCrowdfundWithdrawalsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/withdrawals"
    };
  }

  // Close crowdfund campaign (legacy; flips status without refunds).
  // Use CancelCrowdfund for the user-facing flow.
  rpc CloseCrowdfund(CloseCrowdfundRequest) returns (CloseCrowdfundResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/closecrowdfund"
      body: "*"
    };
  }

  // Cancel campaign and queue auto-refunds for every outstanding
  // contribution. Synchronous DB transition (status='cancelling')
  // plus async worker that drains the refund queue and advances
  // status to 'cancelled' once all refunds settle.
  rpc CancelCrowdfund(CancelCrowdfundRequest) returns (CancelCrowdfundResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/crowdfund/cancel"
      body: "*"
    };
  }

  // Admin force-complete: flip status to 'completed' without
  // refunds. Used for stuck campaigns where the contributors got
  // the outcome they pledged for (e.g. campaign delivered but
  // never hit numerical target).
  rpc ForceCompleteCrowdfund(ForceCompleteCrowdfundRequest) returns (ForceCompleteCrowdfundResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/crowdfund/force-complete"
      body: "*"
    };
  }

  // List per-campaign refund audit rows. Admin sees all rows for
  // a campaign; non-admins see only refunds where they are the
  // contributor.
  rpc ListCrowdfundRefunds(ListCrowdfundRefundsRequest) returns (ListCrowdfundRefundsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/refunds"
    };
  }

  // Operator escape hatch: flip a 'failed' refund row back to
  // 'pending' so the worker re-picks it. Used after fixing the
  // underlying account_unavailable / network error.
  rpc RetryCrowdfundRefund(RetryCrowdfundRefundRequest) returns (RetryCrowdfundRefundResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/crowdfund/refunds/retry"
      body: "*"
    };
  }

  // Get crowdfund statistics with enhanced analytics
  rpc GetCrowdfundStatistics(GetCrowdfundStatisticsRequest) returns (GetCrowdfundStatisticsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/statistics"
    };
  }

  // Search crowdfunds by query (title, creator username, or crowdfund code)
  rpc SearchCrowdfunds(SearchCrowdfundsRequest) returns (SearchCrowdfundsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfunds/search"
    };
  }

  // Update crowdfund campaign (creator only)
  rpc UpdateCrowdfund(UpdateCrowdfundRequest) returns (UpdateCrowdfundResponse) {
    option (google.api.http) = {
      put: "/api/v1/products/crowdfund"
      body: "*"
    };
  }

  // Delete crowdfund campaign (creator only, must have no contributions)
  rpc DeleteCrowdfund(DeleteCrowdfundRequest) returns (DeleteCrowdfundResponse) {
    option (google.api.http) = {
      delete: "/api/v1/products/crowdfund"
    };
  }

  // Get donations for a specific crowdfund
  rpc GetCrowdfundDonations(GetCrowdfundDonationsRequest) returns (GetCrowdfundDonationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/donations"
    };
  }

  // Get all donations made by current user
  rpc GetUserDonations(GetUserDonationsRequest) returns (GetUserDonationsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/donations"
    };
  }

  // Generate donation receipt
  rpc GenerateDonationReceipt(GenerateDonationReceiptRequest) returns (GenerateDonationReceiptResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/donation/receipt"
      body: "*"
    };
  }

  // Get all crowdfund receipts for current user
  rpc GetUserCrowdfundReceipts(GetUserCrowdfundReceiptsRequest) returns (GetUserCrowdfundReceiptsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/receipts"
    };
  }

  // === NOTIFICATION CHANNEL OPERATIONS ===

  // Connect a notification channel (Telegram, Discord, WhatsApp Business)
  rpc ConnectNotificationChannel(ConnectNotificationChannelRequest) returns (ConnectNotificationChannelResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/notification-channels/connect"
      body: "*"
    };
  }

  // Disconnect a notification channel
  rpc DisconnectNotificationChannel(DisconnectNotificationChannelRequest) returns (DisconnectNotificationChannelResponse) {
    option (google.api.http) = {
      delete: "/api/v1/products/notification-channels/{channel_id}"
    };
  }

  // Get all notification channels for a crowdfund
  rpc GetNotificationChannels(GetNotificationChannelsRequest) returns (GetNotificationChannelsResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/{crowdfund_id}/notification-channels"
    };
  }

  // Update notification channel settings
  rpc UpdateNotificationChannel(UpdateNotificationChannelRequest) returns (UpdateNotificationChannelResponse) {
    option (google.api.http) = {
      put: "/api/v1/products/notification-channels/{channel_id}"
      body: "*"
    };
  }

  // Test notification channel (send test message)
  rpc TestNotificationChannel(TestNotificationChannelRequest) returns (TestNotificationChannelResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/notification-channels/{channel_id}/test"
      body: "*"
    };
  }

  // Get Telegram bot info for linking
  rpc GetTelegramBotInfo(GetTelegramBotInfoRequest) returns (GetTelegramBotInfoResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/notification-channels/telegram/bot-info"
    };
  }

  // Verify Telegram channel connection
  rpc VerifyTelegramChannel(VerifyTelegramChannelRequest) returns (VerifyTelegramChannelResponse) {
    option (google.api.http) = {
      post: "/api/v1/products/notification-channels/telegram/verify"
      body: "*"
    };
  }

  // Get notification delivery history
  rpc GetNotificationHistory(GetNotificationHistoryRequest) returns (GetNotificationHistoryResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfund/{crowdfund_id}/notification-history"
    };
  }

  // === CROWDFUND LEADERBOARD ===

  // Get crowdfund leaderboard (public, no auth required)
  rpc GetCrowdfundLeaderboard(GetCrowdfundLeaderboardRequest) returns (GetCrowdfundLeaderboardResponse) {
    option (google.api.http) = {
      get: "/api/v1/products/crowdfunds/leaderboard"
    };
  }

  // === AUTOSAVE OPERATIONS ===

  // Create auto-save rule
  rpc CreateAutoSaveRule(CreateAutoSaveRuleRequest2) returns (CreateAutoSaveRuleResponse2) {
    option (google.api.http) = {
      post: "/api/v1/products/autosave/rules"
      body: "*"
    };
  }

  // Get auto-save rules
  rpc GetAutoSaveRules(GetAutoSaveRulesRequest2) returns (GetAutoSaveRulesResponse2) {
    option (google.api.http) = {
      get: "/api/v1/products/autosave/rules"
    };
  }

  // Update auto-save rule
  rpc UpdateAutoSaveRule(UpdateAutoSaveRuleRequest2) returns (UpdateAutoSaveRuleResponse2) {
    option (google.api.http) = {
      put: "/api/v1/products/autosave/rules"
      body: "*"
    };
  }

  // Toggle auto-save rule (pause/resume)
  rpc ToggleAutoSaveRule(ToggleAutoSaveRuleRequest2) returns (ToggleAutoSaveRuleResponse2) {
    option (google.api.http) = {
      post: "/api/v1/products/autosave/rules/toggle"
      body: "*"
    };
  }

  // Delete auto-save rule
  rpc DeleteAutoSaveRule(DeleteAutoSaveRuleRequest2) returns (DeleteAutoSaveRuleResponse2) {
    option (google.api.http) = {
      delete: "/api/v1/products/autosave/rules"
    };
  }

  // Get auto-save transactions
  rpc GetAutoSaveTransactions(GetAutoSaveTransactionsRequest2) returns (GetAutoSaveTransactionsResponse2) {
    option (google.api.http) = {
      get: "/api/v1/products/autosave/transactions"
    };
  }

  // Get auto-save statistics
  rpc GetAutoSaveStatistics(GetAutoSaveStatisticsRequest2) returns (GetAutoSaveStatisticsResponse2) {
    option (google.api.http) = {
      get: "/api/v1/products/autosave/statistics"
    };
  }

  // Manually trigger auto-save
  rpc TriggerAutoSave(TriggerAutoSaveRequest2) returns (TriggerAutoSaveResponse2) {
    option (google.api.http) = {
      post: "/api/v1/products/autosave/trigger"
      body: "*"
    };
  }
}

// ===== MODELS =====

// Group Account Models
message GroupAccount {
  string id = 1;
  string name = 2;
  string description = 3;
  string creator_id = 4;
  double balance = 5;
  double target_amount = 6;
  string status = 7;                    // "active", "closed", "locked"
  repeated GroupMember members = 8;
  string withdrawal_rules = 9;          // JSON: voting, threshold, etc.
  string created_at = 10;
  string updated_at = 11;
}

message GroupMember {
  string user_id = 1;
  string name = 2;
  string role = 3;                      // "admin", "member"
  double contribution = 4;
  string joined_at = 5;
}

// Insurance Models
message Insurance {
  string id = 1;
  string user_id = 2;
  string account_id = 3;
  string policy_number = 4;
  string plan_id = 5;
  string plan_name = 6;
  string coverage_type = 7;             // "health", "life", "auto", "property"
  double premium = 8;
  double coverage_amount = 9;
  string payment_frequency = 10;        // "monthly", "quarterly", "annually"
  string status = 11;                   // "active", "expired", "cancelled", "claimed"
  string start_date = 12;
  string end_date = 13;
  string next_payment_date = 14;
  string beneficiary = 15;
  string metadata = 16;                 // JSON metadata
  string created_at = 17;
  string updated_at = 18;
}

message InsurancePlan {
  string id = 1;
  string name = 2;
  string coverage_type = 3;
  string description = 4;
  double min_premium = 5;
  double max_premium = 6;
  double coverage_amount = 7;
  repeated string benefits = 8;
  string terms = 9;
  bool is_active = 10;
}

message InsuranceClaim {
  string id = 1;
  string policy_id = 2;
  string user_id = 3;
  double claim_amount = 4;
  string reason = 5;
  string status = 6;                    // "pending", "approved", "rejected", "paid"
  string documents = 7;                 // JSON array of document URLs
  string created_at = 8;
  string updated_at = 9;
}

// Crowdfund Models
message Crowdfund {
  string id = 1;
  string user_id = 2;                   // Campaign creator
  string account_id = 3;                // Account to receive funds
  string title = 4;
  string description = 5;
  string category = 6;                  // "medical", "education", "business", "charity"
  double target_amount = 7;
  double current_amount = 8;
  double percentage_funded = 9;
  int32 total_contributors = 10;
  string status = 11;                   // "active","paused","cancelling","cancelled","completed","expired"
  string image_url = 12;
  string deadline = 13;
  string created_at = 14;
  string updated_at = 15;
  string crowdfund_code = 16;           // Unique short code (e.g. CF-A3B5K7)
  string creator_first_name = 17;
  string creator_last_name = 18;
  string creator_username = 19;
  string creator_email = 20;

  // Cancellation context (set when status transitions to
  // 'cancelling'; persists onto 'cancelled').
  string cancel_reason = 21;
  string cancel_initiated_by = 22;       // "creator"|"admin"|"system"
  string cancel_initiator_user_id = 23;
  string cancelled_at = 24;              // ISO-8601 string when set

  // Refund progress counters (denormalized by the refund worker).
  int32  refunds_pending   = 25;
  int32  refunds_completed = 26;
  int32  refunds_failed    = 27;
  double total_refunded    = 28;
}

message CrowdfundContribution {
  string id = 1;
  string crowdfund_id = 2;
  string user_id = 3;
  double amount = 4;
  string message = 5;
  bool is_anonymous = 6;
  string created_at = 7;
}

