  ContributionType type = 7;
  ContributionFrequency frequency = 8;
  uint64 regular_amount = 9;
  google.protobuf.Timestamp start_date = 10;
  int32 total_cycles = 11;
  repeated string member_rotation_order = 12;  // UUID strings for member rotation
  bool auto_pay_enabled = 13;
  uint64 penalty_amount = 14;
  int32 grace_period_days = 15;
  bool allow_partial_payments = 16;
  uint64 minimum_balance = 17;
  string metadata = 18;  // JSON string for external links (whatsapp, telegram) etc
  // Drives the payout scheduler: when true, the platform fires the
  // payout automatically once a receiver is set. When false, the
  // creator must press the manual-trigger CTA.
  bool auto_payout_enabled = 19;
  // Who receives the payout for the first cycle. REQUIRED for one_time:
  // there is deliberately no server-side fallback — not even the creator —
  // because silently choosing a recipient for a money movement hides that
  // decision from the person making it. rotating_savings ignores this field:
  // its receiver is member_rotation_order[0], so the rotation order IS the
  // selection. Empty ⇒ the contribution is created in pending_receiver,
  // which is what older app builds will keep doing.
  string payout_receiver_user_id = 20;
  // Optional avatar, as a storage-service public URL already uploaded by
  // the client. Empty is valid and means "no avatar".
  string image_url = 21;

  // Rotating savings only: create the circle CLOSED, so the creator can keep
  // adding members and then OPEN it when the roster is final.
  //
  // Defaults false, and that default is load-bearing. An app build that
  // predates the Open button never sends this field, so its esusus must
  // start immediately exactly as they always have — otherwise every circle
  // created on an older build would sit unopened forever, never charging and
  // never paying out, with no control anywhere to start it.
  bool open_later = 22;
