// RestartContribution closes the current cycle of a one-time
// contribution and opens a fresh one with the same members and
// settings. Used after a one-time goal is reached so the group can
// keep saving toward a new target without losing the roster. Admin
// only. ROSCA contributions auto-rotate via advancePayoutRotationCore
// and don't go through this RPC.
message RestartContributionRequest {
  string contribution_id = 1;
  // Optional new target for the next cycle. 0 keeps the existing
  // target_amount.
  uint64 new_target_amount = 2;
  // Optional new deadline. Empty keeps the existing deadline.
  google.protobuf.Timestamp new_deadline = 3;
  string reason = 4;
}

// ===== SAVINGS CIRCLE ROUNDS =====
//
// A round is one full pass through the members. When the agreed cycles have
// all run the circle is `completed`, and its creator chooses: go round again,
// or end it. Starting a round moves NO money — it appends one payout slot per
// active member, raises total_cycles, extends the deadline and reopens the
// circle; collection and payout then run through the existing paths unchanged.

// Stable codes for why another round cannot start. The app switches on these,
// so they are part of the contract and must not be reworded.
//   round_ready                 - another round can start now
//   round_not_rotating          - only a savings circle runs in rounds
//   round_no_agreed_cycles      - indefinite circle; it keeps rotating
//   round_still_running         - this round has cycles left
//   round_contribution_stopped  - cancelled or paused by a person
//   round_already_ended         - the creator ended it
//   round_payout_in_flight      - a payout from this round has not finished
//   round_pot_not_empty         - this round's money is still in the pot
//   round_no_active_members     - a round would have no cycles
message ContributionRoundState {
  string code = 1;
  // Shown to the creator. Names the specific thing to fix.
  string reason = 2;
  bool can_start_next_round = 3;
  int32 current_round = 4;
  int32 cycles_completed = 5;
  int32 total_cycles = 6;
  // How many cycles the NEXT round would have, i.e. the active member count.
  int32 active_members = 7;
  // Money still in the pot, in minor units. Non-zero is a refusal reason.
  uint64 residual_pot_minor = 8;
  int32 payouts_in_flight = 9;
  // True once the creator has ended the circle; no round can follow.
  bool rounds_ended = 10;
}

message GetContributionRoundStateRequest {
  string contribution_id = 1;
}

message GetContributionRoundStateResponse {
  ContributionMessage contribution = 1;
  ContributionRoundState state = 2;
}

message StartNextContributionRoundRequest {
  string contribution_id = 1;
  string reason = 2;
}

message StartNextContributionRoundResponse {
  ContributionMessage contribution = 1;
  ContributionRoundState state = 2;
  int32 round = 3;
  int32 cycles_added = 4;
  int32 first_cycle = 5;
  int32 last_cycle = 6;
  google.protobuf.Timestamp new_deadline = 7;
}

message EndContributionRoundsRequest {
  string contribution_id = 1;
  string reason = 2;
}

message EndContributionRoundsResponse {
  ContributionMessage contribution = 1;
  ContributionRoundState state = 2;
}

message RestartContributionResponse {
  ContributionMessage contribution = 1;
  int32 cycles_completed = 2;
  int32 new_current_cycle = 3;
}

// ContributionMessage = a single chat message in a per-contribution
// chat. Kind is one of: "text", "voice", "image". Text messages
// carry body; voice/image carry media_url and (for voice) duration_ms.
message ContributionMessageProto {
  string id = 1;
  string contribution_id = 2;
  string sender_id = 3;
  string sender_name = 4;
  string kind = 5;        // text | voice | image
  string body = 6;        // text content (text kind only)
  string media_url = 7;   // CDN/asset URL (voice/image)
  int32 duration_ms = 8;  // voice note duration
  string created_at = 9;  // RFC3339

  // Echoed back so the app can match the server row to its optimistic
  // bubble instead of rendering the message twice.
  string client_message_id = 10;
  // Reply quote. Denormalised: survives deletion of the original.
  string reply_to_message_id = 11;
  string reply_to_body = 12;
  string reply_to_sender = 13;
  // Non-empty ⇒ show an "edited" marker.
  string edited_at = 14;      // RFC3339
  // True ⇒ render "This message was deleted" in place; body/media are blank.
  bool deleted_for_everyone = 15;
  // User ids @-mentioned in `body`. Lets the bubble highlight the right names
  // and lets a client tell "you were tagged" without a second lookup.
  repeated string mentioned_user_ids = 16;

  // A member tagged Lazervault support on this message. Drives the "waiting
  // on support" marker in the bubble and the operator queue.
  bool support_requested = 17;

  // Posted BY support, through the admin surface. The app renders it
  // differently: a member has to be able to tell Lazervault apart from the
  // person in their circle who is asking them for money.
  bool is_support = 18;
}

message SendContributionMessageRequest {
  string contribution_id = 1;
  string kind = 2;        // text | voice | image
  string body = 3;
  string media_url = 4;
  int32 duration_ms = 5;
  // Client-generated id that makes SEND idempotent: a retry after a timeout
  // returns the original message instead of posting a duplicate.
  string client_message_id = 6;
  // Optional: the message being replied to.
  string reply_to_message_id = 7;
  // User ids @-mentioned in `body`, in the order they appear.
  //
  // Sent as ids rather than parsed out of the text server-side: the client
  // already knows exactly who was picked, and re-deriving targets from
  // "@Ada" would guess wrong the moment two members share a first name.
  // The server does NOT trust them — every id is checked against the group's
  // active membership before it is stored or notified, because a mention
  // sends a push carrying a preview of a private group's messages.
  repeated string mentioned_user_ids = 8;

  // Tag Lazervault support on this message.
  //
  // A separate flag rather than a sentinel id in mentioned_user_ids: support
  // is not a member, has no user id in this group, and must not be pushed a
  // member notification. Mixing it in would put a fake user into the one
  // field that decides who receives a preview of a private conversation.
  bool mention_support = 9;

  // Tag EVERY active member ("@all").
  //
  // A flag rather than the client listing every id: the roster is the
  // server's to know, and a client that last loaded the member list an hour
  // ago would tag the people it remembers rather than the people who are
  // actually in the circle. The service expands it against active membership
  // at send time, which is the same check every explicit id already passes.
  bool mention_all = 10;
}

message SendContributionMessageResponse {
  ContributionMessageProto message = 1;
}

