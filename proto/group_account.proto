message UpdateContributionRequest {
  string contribution_id = 1;
  string title = 2;
  string description = 3;
  uint64 target_amount = 4;
  google.protobuf.Timestamp deadline = 5;
  ContributionStatus status = 6;
  string metadata = 7;  // JSON string for external links (whatsapp, telegram) etc
  // Optional toggle. Wrapped in a oneof-style explicit "set" flag so
  // a caller that omits the field doesn't accidentally flip it to
  // false. The handler treats auto_payout_enabled_set=false as
  // "leave the existing value alone".
  bool auto_payout_enabled = 8;
  bool auto_payout_enabled_set = 9;
  // Rotating-savings cycle count. Same explicit-set pattern as the toggle
  // above: 0 with total_cycles_set=false means "leave alone", which matters
  // because every other caller of this RPC omits it.
  //
  // The agreed number of cycles. When cycles_completed reaches it the
  // rotation CLOSES: the contribution goes to completed, the remaining
  // payout slots are cancelled, and nothing further is charged or paid.
  //
  // It used to be purely informational while the app asked for it and showed
  // the creator a "Rotation Ends" date — so the circle promised an end the
  // server never delivered, and no member could ever leave it cleanly.
  //
  // A contribution with no count stored still rotates indefinitely, which is
  // the real-world esusu that runs as long as its members want it to.
  int32 total_cycles = 10;
  bool total_cycles_set = 11;
  // Avatar, with the same explicit-set pattern as the toggles above —
  // needed in BOTH directions here: without the flag an empty string is
  // indistinguishable from "field omitted", so REMOVING an avatar would be
  // impossible, and every caller that omits it would silently clear one.
  string image_url = 12;
  bool image_url_set = 13;
  // AUTO-DEBIT, with the same explicit-set pattern as the toggles above.
  //
  // auto_pay_enabled was settable ONLY at creation. A circle created with it
  // off could never have it turned on, so its members kept getting "payment
  // past due" nudges forever with no way to say "just take it from my
  // wallet" — the overdue fire gates auto-charge on this exact flag and does
  // nothing else when it is false.
  //
  // Additive fields on an existing message: an older client that omits them
  // sends auto_pay_enabled_set=false, which means "leave it alone", so no
  // caller changes behaviour by upgrading.
  bool auto_pay_enabled = 14;
  bool auto_pay_enabled_set = 15;
}

message UpdateContributionResponse {
  ContributionMessage contribution = 1;
}

