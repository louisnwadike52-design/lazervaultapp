  // True when the group requires approval and this call filed a REQUEST
  // rather than joining. The member above is then the pending row, not a
  // membership — clients must not navigate into the group on the strength
  // of it.
  bool pending_approval = 4;
}

// ---- Join requests (public groups requiring admin approval) ---------------

message ListJoinRequestsRequest {
  string group_id = 1;
}

// Every join request awaiting THIS admin, across all their groups.
//
// ListJoinRequests is per-group, which suits the group's own screen but cannot
// answer "is anything waiting on me?" — the question the Group Funds tab
// exists to answer. Asking it per-group from the client would be one RPC per
// group the user administers, on a tab that opens on every visit.
message ListMyPendingJoinRequestsRequest {
  int32 limit = 1; // default 50, max 200
}

message ListMyPendingJoinRequestsResponse {
  repeated PendingJoinRequest requests = 1;
  int32 total = 2;
}

// A request plus the group it is for, so the tab can render a row without a
// second fetch per group.
message PendingJoinRequest {
  GroupMemberMessage member = 1;
  string group_id           = 2;
  string group_name         = 3;
  string group_image_url    = 4;
  int32  group_member_count = 5;
}

message ListJoinRequestsResponse {
  repeated GroupMemberMessage requests = 1;
}

message DecideJoinRequestRequest {
  string group_id = 1;
  // The person who asked to join.
  string requester_id = 2;
  // true approves, false rejects. One RPC rather than two so a client
  // cannot approve when it meant to reject by calling the wrong endpoint.
  bool approve = 3;
  // Optional note from the admin, carried to the requester's notification.
  string note = 4;
}

message DecideJoinRequestResponse {
  GroupMemberMessage member = 1;
  string message = 2;
}

message WithdrawJoinRequestRequest {
  string group_id = 1;
}

message WithdrawJoinRequestResponse {
  string message = 1;
}

// ============================================================================
// PAGINATION INFO
// ============================================================================

// =====================================================================
// Per-user dashboard preferences: hide ("delete") + persisted order
//
// Both are properties of a USER's view, not of the group or contribution,
// so they live in their own table keyed by (user_id, item_type, item_id)
// and NOTHING here deletes or reorders anything for anyone else.
// =====================================================================

// item_type vocabulary, shared by every request below.
//   "group"        → a joint-funds group on the My Groups list
//   "contribution" → a contribution on a group's contributions list
message OpenContributionRequest {
  string contribution_id = 1;

  // The SCHEDULE, decided at start rather than at creation.
  //
  // A circle is created closed and only starts once the creator has finished
  // adding members — often days later. Collecting the cycle length and the
  // number of cycles at creation meant the window was already running down
  // before anyone could pay into it.
  //
  // All three are optional on the wire so an older app, which sends only
  // contribution_id, still starts a circle using whatever was stored at
  // creation. Unset frequency is UNSPECIFIED and unset total_cycles is 0;
  // the server treats both as "keep what you have".
  ContributionFrequency frequency = 2;
  int32 total_cycles = 3;

  // Optional explicit end date. Left unset the server derives it as
  // start + total_cycles × frequency_period, which is the rotation end and
  // the only value consistent with the cycle boundaries the scheduler fires
  // on. Must be in the future.
  google.protobuf.Timestamp deadline = 4;
}

message OpenContributionResponse {
  ContributionMessage contribution = 1;
  bool   success = 2;
  string message = 3;
}

message SetDashboardOrderRequest {
  string item_type = 1;
  // ordered_item_ids is the FULL visible page order after the drag, front
  // to back. Sent as a list rather than one moved item + index because the
  // client already knows the final order and a single (item, index) pair
  // cannot express a reorder without the server re-deriving everyone
  // else's position — which is exactly where two concurrent drags drift.
  repeated string ordered_item_ids = 2;
  // Required when item_type == "contribution": the group whose list was
  // reordered. Scopes the write so a drag in one group cannot renumber
  // another group's contributions.
  string scope_id = 3;
  // 0-based rank of ordered_item_ids[0] within the whole list. Non-zero on
  // page 2+ of a paginated list, so reordering page 3 does not renumber
  // those rows to the front of the list.
  int32 start_index = 4;
}

message SetDashboardOrderResponse {
  bool   success = 1;
  string message = 2;
  int32  items_updated = 3;
}

message HideDashboardItemRequest {
  string item_type = 1;
  string item_id   = 2;
}

message HideDashboardItemResponse {
  bool   success = 1;
  string message = 2;
}

message UnhideDashboardItemRequest {
  string item_type = 1;
  string item_id   = 2;
}

message UnhideDashboardItemResponse {
  bool   success = 1;
  string message = 2;
}

message GroupPaginationInfo {
  int32 current_page = 1;
  int32 total_pages = 2;
  int32 total_items = 3;
  int32 items_per_page = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

message ContributionPaginationInfo {
  int32 current_page = 1;
  int32 total_pages = 2;
  int32 total_items = 3;
  int32 items_per_page = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

message PaymentPaginationInfo {
  int32 current_page = 1;
  int32 total_pages = 2;
  int32 total_items = 3;
  int32 items_per_page = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

message ReceiptPaginationInfo {
  int32 current_page = 1;
  int32 total_pages = 2;
  int32 total_items = 3;
  int32 items_per_page = 4;
  bool has_next = 5;
  bool has_prev = 6;
}

message ActivityLogPaginationInfo {
  int32 current_page = 1;
  int32 total_pages = 2;
  int32 total_count = 3;
  bool has_more = 4;
}

// ============================================================================
// ACTIVITY LOG MESSAGES
// ============================================================================

message GroupActivityLogMessage {
  string id = 1;
  string group_id = 2;
  optional string contribution_id = 3;
  string actor_user_id = 4;
  string actor_name = 5;
  string action_type = 6;
  string target_type = 7;
  optional string target_id = 8;
  string details = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetGroupActivityLogsRequest {
  string group_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string action_type_filter = 4;
}

message GetGroupActivityLogsResponse {
  repeated GroupActivityLogMessage logs = 1;
  ActivityLogPaginationInfo pagination = 2;
}

message GetContributionActivityLogsRequest {
  string contribution_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetContributionActivityLogsResponse {
  repeated GroupActivityLogMessage logs = 1;
  ActivityLogPaginationInfo pagination = 2;
}

// ============================================================================
// GROUP JOIN LINKS (shareable invite links)
// ============================================================================
// A join link is a GROUP-level, multi-use, expiring token an admin can share
// with anyone (WhatsApp, SMS, email). Distinct from GroupInvitation, which is
// targeted at a known user id. The token carries no authority by itself: the
// joiner must be signed in, and the server re-checks expiry/revocation/uses
// and group capacity before adding them.

message GroupJoinLink {
  string token = 1;
  string group_id = 2;
  string url = 3;                  // canonical https:// share URL
  string created_by_user_id = 4;
  string role = 5;                 // role granted on join (member/moderator)
  string expires_at = 6;           // RFC3339
  int32 max_uses = 7;              // 0 = unlimited
  int32 use_count = 8;
  bool revoked = 9;
  string created_at = 10;
}

message CreateGroupJoinLinkRequest {
  string group_id = 1;
  // Optional overrides. expires_in_hours 0 => server default (7 days);
  // max_uses 0 => unlimited.
  int32 expires_in_hours = 2;
  int32 max_uses = 3;
  string role = 4;
  // When true, mint a NEW token even if an active one exists (rotates the
  // link, invalidating anything already shared).
  bool rotate = 5;
}

message CreateGroupJoinLinkResponse {
  GroupJoinLink link = 1;
}

message GetGroupJoinLinkRequest {
  string token = 1;
}

// Preview shown BEFORE joining: enough to decide, nothing sensitive (no
// member list, no balances).
message GetGroupJoinLinkResponse {
  bool valid = 1;
  string invalid_reason = 2;       // expired | revoked | exhausted | not_found
  string group_id = 3;
  string group_name = 4;
  string group_description = 5;
  int32 member_count = 6;
  string inviter_name = 7;
  string role = 8;
  string expires_at = 9;
  bool already_member = 10;
}

message JoinGroupViaLinkRequest {
  string token = 1;
}

message JoinGroupViaLinkResponse {
  bool success = 1;
  string message = 2;
  string group_id = 3;
  GroupMemberMessage member = 4;
  bool already_member = 5;
}

message RevokeGroupJoinLinkRequest {
  string group_id = 1;
}

message RevokeGroupJoinLinkResponse {
  bool success = 1;
}

// ---- Platform fee quote ----------------------------------------------------
// One place the app asks "what will this cost?" so the number a member sees
// before paying is produced by the SAME code that later charges them.

message GetGroupFundsFeeQuoteRequest {
  // Amount the fee is charged on, in MINOR units (kobo/cents).
  int64 amount_minor = 1;
  // Which leg: "contribution" (member pays in) or "payout" (recipient is
  // paid). Empty defaults to contribution.
  string leg = 2;
}

message GetGroupFundsFeeQuoteResponse {
  bool fee_applies = 1;
  int64 fee_minor = 2;
  // amount + fee for the contribution leg; amount - fee for the payout leg.
  int64 total_minor = 3;
  // Human label, e.g. "1% (max ₦1,000)" or "₦50 flat". Empty when no fee.
  string description = 4;
}

// ---- Contribution chat state ----------------------------------------------
// Read watermarks, typing presence and message mutation. Message CONTENT uses
// the existing Send/ListContributionMessages RPCs.

message ContributionReader {
  string user_id = 1;
  string user_name = 2;
  string last_read_message_id = 3;
  string last_read_at = 4;           // RFC3339
}

message ContributionTyping {
  string user_id = 1;
  string user_name = 2;
}

message MarkContributionReadRequest {
  string contribution_id = 1;
  // Newest message the caller has seen. The server refuses to move a
  // watermark backwards, so replaying an older id is a no-op.
  string message_id = 2;
}
message MarkContributionReadResponse { bool success = 1; }

message GetContributionChatStateRequest { string contribution_id = 1; }
message GetContributionChatStateResponse {
  repeated ContributionReader readers = 1;
  repeated ContributionTyping typing = 2;
  int64 unread_count = 3;
}

message SetContributionTypingRequest {
  string contribution_id = 1;
  bool is_typing = 2;
}
message SetContributionTypingResponse { bool success = 1; }

message EditContributionMessageRequest {
  string contribution_id = 1;
  string message_id = 2;
  string body = 3;
}
message EditContributionMessageResponse { ContributionMessageProto message = 1; }

message DeleteContributionMessageForEveryoneRequest {
  string contribution_id = 1;
  string message_id = 2;
}
message DeleteContributionMessageForEveryoneResponse { bool success = 1; }

// ============================================================================
// SERVICE DEFINITION
// ============================================================================

service GroupAccountService {
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {
    option (google.api.http) = {
      post: "/v1/groups"
      body: "*"
    };
  }

  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse) {
    option (google.api.http) = {
      get: "/v1/groups/{group_id}"
    };
  }

  rpc ListUserGroups(ListUserGroupsRequest) returns (ListUserGroupsResponse) {
    option (google.api.http) = {
      get: "/v1/groups"
    };
  }

  // ListPastContributions returns contributions the caller used to
  // belong to but has been removed from / left voluntarily. Backed by
  // contribution_members rows where removed_at IS NOT NULL. Filter
  // values: "" (all), "removed" (admin-removed), "left" (self-exit).
  rpc ListPastContributions(ListPastContributionsRequest) returns (ListPastContributionsResponse) {
    option (google.api.http) = {
      get: "/v1/me/past-contributions"
    };
  }

  // ListPastGroups returns groups the caller has been removed from /
  // left. Mirrors ListPastContributions over group_members soft-delete.
  rpc ListPastGroups(ListPastGroupsRequest) returns (ListPastGroupsResponse) {
    option (google.api.http) = {
      get: "/v1/me/past-groups"
    };
  }

  // GetPastContributionDetails aggregates everything the read-only
  // detail screen needs in one round-trip: contribution meta, the
  // caller's payments (with refund status per cycle), all members,
  // closed cycles, and the cycle that was active when the caller was
  // removed (if any). Permitted via assertCanIncludingExited so an
  // ex-member can still see what they used to be part of.
  rpc GetPastContributionDetails(GetPastContributionDetailsRequest) returns (GetPastContributionDetailsResponse) {
    option (google.api.http) = {
      get: "/v1/me/past-contributions/{contribution_id}"
    };
  }

  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse) {
    option (google.api.http) = {
      put: "/v1/groups/{group_id}"
      body: "*"
    };
  }

  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {
    option (google.api.http) = {
      delete: "/v1/groups/{group_id}"
    };
  }

  rpc GetGroupMembers(GetGroupMembersRequest) returns (GetGroupMembersResponse) {
    option (google.api.http) = {
      get: "/v1/groups/{group_id}/members"
    };
  }

  rpc AddMember(AddMemberRequest) returns (AddMemberResponse) {
    option (google.api.http) = {
      post: "/v1/groups/{group_id}/members"
      body: "*"
    };
  }

  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse) {
    option (google.api.http) = {
      put: "/v1/groups/{group_id}/members/{member_id}"
      body: "*"
    };
  }

  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (google.api.http) = {
      delete: "/v1/groups/{group_id}/members/{member_id}"
    };
  }

  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {
    option (google.api.http) = {
      get: "/v1/groups/users/search"
    };
  }

  rpc CreateContribution(CreateContributionRequest) returns (CreateContributionResponse) {
    option (google.api.http) = {
      post: "/v1/groups/{group_id}/contributions"
      body: "*"
    };
  }

  rpc GetContribution(GetContributionRequest) returns (GetContributionResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}"
    };
  }

  rpc ListGroupContributions(ListGroupContributionsRequest) returns (ListGroupContributionsResponse) {
    option (google.api.http) = {
      get: "/v1/groups/{group_id}/contributions"
    };
  }

  rpc UpdateContribution(UpdateContributionRequest) returns (UpdateContributionResponse) {
    option (google.api.http) = {
      put: "/v1/contributions/{contribution_id}"
      body: "*"
    };
  }

  rpc DeleteContribution(DeleteContributionRequest) returns (DeleteContributionResponse) {
    option (google.api.http) = {
      delete: "/v1/contributions/{contribution_id}"
    };
  }

  rpc AddMembersToContribution(AddMembersToContributionRequest) returns (AddMembersToContributionResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/members"
      body: "*"
    };
  }

  rpc PreviewMemberExit(PreviewMemberExitRequest) returns (PreviewMemberExitResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/members/{member_user_id}/exit/preview"
    };
  }

  // =====================================================================
  // Invite-first membership (slice 2)
  // =====================================================================

  rpc InviteToGroup(InviteToGroupRequest) returns (InviteToGroupResponse) {
    option (google.api.http) = {
      post: "/v1/groups/{group_id}/invitations"
      body: "*"
    };
  }

  rpc RespondToGroupInvite(RespondToGroupInviteRequest) returns (RespondToGroupInviteResponse) {
    option (google.api.http) = {
      post: "/v1/invitations/{invitation_id}/respond"
      body: "*"
    };
  }

  rpc CancelGroupInvite(CancelGroupInviteRequest) returns (CancelGroupInviteResponse) {
    option (google.api.http) = {
      delete: "/v1/invitations/{invitation_id}"
    };
  }

  rpc ListMyInvitations(ListMyInvitationsRequest) returns (ListMyInvitationsResponse) {
    option (google.api.http) = {
      get: "/v1/me/invitations"
    };
  }

  rpc ListGroupInvitations(ListGroupInvitationsRequest) returns (ListGroupInvitationsResponse) {
    option (google.api.http) = {
      get: "/v1/groups/{group_id}/invitations"
    };
  }

  rpc RemoveContributionShadow(RemoveContributionShadowRequest) returns (RemoveContributionShadowResponse) {
    option (google.api.http) = {
      delete: "/v1/contributions/{contribution_id}/shadow-members/{member_user_id}"
    };
  }

  rpc RemoveMemberFromContribution(RemoveMemberFromContributionRequest) returns (RemoveMemberFromContributionResponse) {
    option (google.api.http) = {
      delete: "/v1/contributions/{contribution_id}/members/{member_user_id}"
    };
  }

  rpc GetContributionMembers(GetContributionMembersRequest) returns (GetContributionMembersResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/members"
    };
  }

  rpc MakePayment(MakePaymentRequest) returns (MakePaymentResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/payments"
      body: "*"
    };
  }

  rpc GetContributionPayments(GetContributionPaymentsRequest) returns (GetContributionPaymentsResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/payments"
    };
  }

  rpc UpdatePaymentStatus(UpdatePaymentStatusRequest) returns (UpdatePaymentStatusResponse) {
    option (google.api.http) = {
      put: "/v1/payments/{payment_id}"
      body: "*"
    };
  }

  rpc ProcessScheduledPayments(ProcessScheduledPaymentsRequest) returns (ProcessScheduledPaymentsResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/scheduled-payments"
      body: "*"
    };
  }

  rpc GetPayoutSchedule(GetPayoutScheduleRequest) returns (GetPayoutScheduleResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/payout-schedule"
    };
  }

  rpc ProcessPayout(ProcessPayoutRequest) returns (ProcessPayoutResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/payouts"
      body: "*"
    };
  }

  rpc UpdatePayoutStatus(UpdatePayoutStatusRequest) returns (UpdatePayoutStatusResponse) {
    option (google.api.http) = {
      put: "/v1/payouts/{payout_id}"
      body: "*"
    };
  }

  rpc AdvancePayoutRotation(AdvancePayoutRotationRequest) returns (AdvancePayoutRotationResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/advance-rotation"
      body: "*"
    };
  }

  // Receiver assignment + scheduled-payout dispatch.
  rpc SetPayoutReceiver(SetPayoutReceiverRequest) returns (SetPayoutReceiverResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/payout-receiver"
      body: "*"
    };
  }

  rpc GetPayoutReceiver(GetPayoutReceiverRequest) returns (GetPayoutReceiverResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/payout-receiver"
    };
  }

  rpc ClearPayoutReceiver(ClearPayoutReceiverRequest) returns (ClearPayoutReceiverResponse) {
    option (google.api.http) = {
      delete: "/v1/contributions/{contribution_id}/payout-receiver"
    };
  }

  rpc TriggerManualPayout(TriggerManualPayoutRequest) returns (TriggerManualPayoutResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/trigger-payout"
      body: "*"
    };
  }

  // SwitchPayoutToManual takes a payout off automation so the creator can fire
  // it themselves once they have fixed whatever blocked it. The alternative we
  // shipped with was "contact support", which is not a flow.
  rpc SwitchPayoutToManual(SwitchPayoutToManualRequest) returns (SwitchPayoutToManualResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/payout-mode/manual"
      body: "*"
    };
  }

  rpc ListScheduledPayouts(ListScheduledPayoutsRequest) returns (ListScheduledPayoutsResponse) {
    option (google.api.http) = {
      get: "/v1/scheduled-payouts"
    };
  }

  rpc GetScheduledPayout(GetScheduledPayoutRequest) returns (GetScheduledPayoutResponse) {
    option (google.api.http) = {
      get: "/v1/scheduled-payouts/{payout_id}"
    };
  }

  rpc GenerateReceipt(GenerateReceiptRequest) returns (GenerateReceiptResponse) {
    option (google.api.http) = {
      post: "/v1/payments/{payment_id}/receipt"
      body: "*"
    };
  }

  rpc GetUserReceipts(GetUserContributionReceiptsRequest) returns (GetUserContributionReceiptsResponse) {
    option (google.api.http) = {
      get: "/v1/group-receipts"
    };
  }

  rpc GenerateTranscript(GenerateTranscriptRequest) returns (GenerateTranscriptResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/transcript"
      body: "*"
    };
  }

  // Cycle history. Each cycle of a contribution (ROSCA rotation or
  // a one-time fresh-start) is frozen at close into
  // contribution_cycles + contribution_cycle_members. These RPCs
  // surface that frozen state to the Flutter cycle-history screen,
  // the cycle-details bottom sheet, and the admin dashboard cycles
  // tab. RestartContribution lets an admin close the current cycle
  // of a one-time contribution and start a fresh one with the same
  // members + settings (canonical "fresh start" path).
  rpc ListContributionCycles(ListContributionCyclesRequest) returns (ListContributionCyclesResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/cycles"
    };
  }

  rpc GetContributionCycleDetails(GetContributionCycleDetailsRequest) returns (GetContributionCycleDetailsResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/cycles/{cycle_index}"
    };
  }

  rpc RestartContribution(RestartContributionRequest) returns (RestartContributionResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/restart"
      body: "*"
    };
  }

  // Savings-circle rounds. GetContributionRoundState is a READ any member may
  // make (it is what drives the CTAs); the two mutations are admin-only and
  // refuse every state in which the previous round's money could be
  // mis-attributed to the next. See ContributionRoundState for the codes.
  rpc GetContributionRoundState(GetContributionRoundStateRequest) returns (GetContributionRoundStateResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/round"
    };
  }
  rpc StartNextContributionRound(StartNextContributionRoundRequest) returns (StartNextContributionRoundResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/round/next"
      body: "*"
    };
  }
  rpc EndContributionRounds(EndContributionRoundsRequest) returns (EndContributionRoundsResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/round/end"
      body: "*"
    };
  }

  // Per-contribution chat: send a message + list recent messages.
  // Persistent storage in `contribution_messages`. Polling-based
  // delivery for now (Flutter polls on a 5s tick while the chat
  // bottom sheet is open). WebSocket fanout can be layered on later
  // without changing the schema or these RPCs.
  rpc SendContributionMessage(SendContributionMessageRequest) returns (SendContributionMessageResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/messages"
      body: "*"
    };
  }

  rpc ListContributionMessages(ListContributionMessagesRequest) returns (ListContributionMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/messages"
    };
  }

  rpc GetGroupStatistics(GetGroupStatisticsRequest) returns (GetGroupStatisticsResponse) {
    option (google.api.http) = {
      get: "/v1/groups/{group_id}/statistics"
    };
  }

  rpc GetUserContributionStats(GetUserContributionStatsRequest) returns (GetUserContributionStatsResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/statistics"
    };
  }

  rpc GetOverdueContributions(GetOverdueContributionsRequest) returns (GetOverdueContributionsResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/overdue"
    };
  }

  rpc GetContributionAnalytics(GetContributionAnalyticsRequest) returns (GetContributionAnalyticsResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/analytics"
    };
  }

  // Activity Log RPCs
  rpc GetGroupActivityLogs(GetGroupActivityLogsRequest) returns (GetGroupActivityLogsResponse) {
    option (google.api.http) = {
      get: "/v1/groups/{group_id}/activity"
    };
  }

  rpc GetContributionActivityLogs(GetContributionActivityLogsRequest) returns (GetContributionActivityLogsResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/activity"
    };
  }

  // Public Group Discovery
  rpc ListPublicGroups(ListPublicGroupsRequest) returns (ListPublicGroupsResponse) {
    option (google.api.http) = {
      get: "/v1/groups/public"
    };
  }

  rpc GetPublicGroup(GetPublicGroupRequest) returns (GetPublicGroupResponse) {
    option (google.api.http) = {
      get: "/v1/groups/public/{group_id}"
    };
  }

  rpc JoinPublicGroup(JoinPublicGroupRequest) returns (JoinPublicGroupResponse) {
    option (google.api.http) = {
      post: "/v1/groups/public/{group_id}/join"
      body: "*"
    };
  }

  // ---- Join requests -----------------------------------------------------
  // The admin's queue for one group. Admin/moderator only: this lists people
  // waiting on a decision about access to the group's money.
  // Everything awaiting this admin's decision, across their groups.
  rpc ListMyPendingJoinRequests(ListMyPendingJoinRequestsRequest) returns (ListMyPendingJoinRequestsResponse) {
    option (google.api.http) = {
      get: "/v1/group-accounts/join-requests/pending"
    };
  }

  rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse) {
    option (google.api.http) = {
      get: "/v1/groups/{group_id}/join-requests"
    };
  }

  // Approve or reject one request. Admin/moderator only.
  rpc DecideJoinRequest(DecideJoinRequestRequest) returns (DecideJoinRequestResponse) {
    option (google.api.http) = {
      post: "/v1/groups/{group_id}/join-requests/{requester_id}/decide"
      body: "*"
    };
  }

  // The requester takes back their own request. Without this the only way out
  // of "awaiting approval" is somebody else's decision, which leaves a person
  // who changed their mind stuck in another group's queue.
  rpc WithdrawJoinRequest(WithdrawJoinRequestRequest) returns (WithdrawJoinRequestResponse) {
    option (google.api.http) = {
      delete: "/v1/groups/{group_id}/join-request"
    };
  }

  // ---- Group join links (shareable invite) -------------------------------
  // Mint (or fetch) the group's active share link. Admin/moderator only —
  // the same gate as inviting a member, since a link IS an open invite.
  rpc CreateGroupJoinLink(CreateGroupJoinLinkRequest) returns (CreateGroupJoinLinkResponse) {
    option (google.api.http) = {
      post: "/v1/groups/{group_id}/join-link"
      body: "*"
    };
  }

  // Preview a shared link before acting on it. Authenticated (so we can say
  // "you're already a member") but requires no group membership.
  rpc GetGroupJoinLink(GetGroupJoinLinkRequest) returns (GetGroupJoinLinkResponse) {
    option (google.api.http) = {
      get: "/v1/group-join-links/{token}"
    };
  }

  // Consume the link: adds the caller to the group. Idempotent — an existing
  // member gets already_member=true instead of a duplicate row or an error.
  rpc JoinGroupViaLink(JoinGroupViaLinkRequest) returns (JoinGroupViaLinkResponse) {
    option (google.api.http) = {
      post: "/v1/group-join-links/{token}/join"
      body: "*"
    };
  }

  // Kill the active link (anything already shared stops working).
  rpc RevokeGroupJoinLink(RevokeGroupJoinLinkRequest) returns (RevokeGroupJoinLinkResponse) {
    option (google.api.http) = {
      delete: "/v1/groups/{group_id}/join-link"
    };
  }


  // Quote the platform fee for a group-funds money movement. Authenticated
  // so it can't be used to probe pricing anonymously; cheap (settings are
  // cached) so the app can call it as the amount changes.
  rpc GetGroupFundsFeeQuote(GetGroupFundsFeeQuoteRequest) returns (GetGroupFundsFeeQuoteResponse) {
    option (google.api.http) = {
      post: "/v1/group-funds/fee-quote"
      body: "*"
    };
  }


  // ---- Contribution chat state -------------------------------------------
  rpc MarkContributionRead(MarkContributionReadRequest) returns (MarkContributionReadResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/messages/read"
      body: "*"
    };
  }

  // One call for everything the chat needs to render state: who has read how
  // far, who is typing, and the caller's unread count.
  rpc GetContributionChatState(GetContributionChatStateRequest) returns (GetContributionChatStateResponse) {
    option (google.api.http) = {
      get: "/v1/contributions/{contribution_id}/chat-state"
    };
  }

  rpc SetContributionTyping(SetContributionTypingRequest) returns (SetContributionTypingResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/typing"
      body: "*"
    };
  }

  rpc EditContributionMessage(EditContributionMessageRequest) returns (EditContributionMessageResponse) {
    option (google.api.http) = {
      patch: "/v1/contributions/{contribution_id}/messages/{message_id}"
      body: "*"
    };
  }

  rpc DeleteContributionMessageForEveryone(DeleteContributionMessageForEveryoneRequest) returns (DeleteContributionMessageForEveryoneResponse) {
    option (google.api.http) = {
      delete: "/v1/contributions/{contribution_id}/messages/{message_id}/everyone"
    };
  }

  // ===== Per-user dashboard preferences =====

  // SetDashboardOrder persists the order the caller dragged their list
  // into, so it survives the session and the next cold start. Per-user:
  // it changes nobody else's list.
  // OpenContribution starts a rotating-savings circle: the roster is frozen
  // from this moment and the rotation begins. Creator / group admin only,
  // and idempotent — opening an already-open circle returns it unchanged
  // rather than erroring, because the client may retry.
  rpc OpenContribution(OpenContributionRequest) returns (OpenContributionResponse) {
    option (google.api.http) = {
      post: "/v1/contributions/{contribution_id}/open"
      body: "*"
    };
  }

  rpc SetDashboardOrder(SetDashboardOrderRequest) returns (SetDashboardOrderResponse) {
    option (google.api.http) = {
      post: "/v1/me/dashboard/order"
      body: "*"
    };
  }

  // HideDashboardItem is the "delete" the user asks for: the row stops
  // appearing on their lists, and NOTHING is removed from the database.
  // Refused while the caller is still an ACTIVE member — you leave first,
  // then you may clear it away — so hiding can never be a way to walk away
  // from a contribution that still holds your money.
  rpc HideDashboardItem(HideDashboardItemRequest) returns (HideDashboardItemResponse) {
    option (google.api.http) = {
      post: "/v1/me/dashboard/hidden"
      body: "*"
    };
  }

  // UnhideDashboardItem restores a hidden row to the caller's past lists.
  rpc UnhideDashboardItem(UnhideDashboardItemRequest) returns (UnhideDashboardItemResponse) {
    option (google.api.http) = {
      delete: "/v1/me/dashboard/hidden/{item_type}/{item_id}"
    };
  }

}
