org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Lowered from -Xmx8G + 4G metaspace — the previous turn's assembleDevDebug
# was OOM-killed (exit -9 = SIGKILL) competing with ~50 backend Go services
# + an Android emulator on this host. Peak working set measured at ~3.0 GB
# during a successful build, so 4 GB heap + 1 GB metaspace fits comfortably.
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
kotlin.incremental=true
android.useAndroidX=true
android.enableJetifier=true
# Kotlin configuration - don't treat deprecation warnings as errors
kotlin.code.style=official
kotlin.compiler.allWarningsAsErrors=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
