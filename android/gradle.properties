org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
# HeapDumpOnOutOfMemoryError REMOVED 2026-11-08.
#
# It writes a dump the size of the live heap — up to 4 GB here — at the exact
# moment the machine has run out of memory. On this host that does not produce
# a diagnostic, it produces a second failure: the box is the BUILD box and the
# production box, and an OOM here already competes with 81 PM2 services. The
# dump was never read; the two kills that prompted this were SIGKILL from the
# kernel, which never reaches the JVM's dump handler anyway.
#
# -Xmx4G is deliberately NOT lowered. The comment below measured a ~3.0 GB peak
# working set on a SUCCESSFUL build, so a smaller ceiling would not reduce real
# usage — it would just trade a kernel OOM for an in-JVM one, which fails the
# build just as hard and wastes the 20 minutes first.
# Lowered from -Xmx8G + 4G metaspace — the previous turn's assembleDevDebug
# was OOM-killed (exit -9 = SIGKILL) competing with ~50 backend Go services
# + an Android emulator on this host. Peak working set measured at ~3.0 GB
# during a successful build, so 4 GB heap + 1 GB metaspace fits comfortably.
org.gradle.parallel=false
org.gradle.workers.max=2
# Kotlin daemon trimmed 2G -> 1G on 2026-11-08.
#
# This is a Flutter app: Kotlin compiles the host Activity shim and the plugin
# glue, not the application. 2 GB was never approached — but it is a SEPARATE
# JVM from Gradle's, so the ceiling stacks on top of the 4 GB above, and the
# two together are what the kernel sees when it decides what to kill.
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m
kotlin.incremental=true
android.useAndroidX=true
android.enableJetifier=true
# Kotlin configuration - don't treat deprecation warnings as errors
kotlin.code.style=official
kotlin.compiler.allWarningsAsErrors=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
