<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  .g{position:relative;width:1024px;height:500px;
     background:
       radial-gradient(700px 500px at 88% 50%, rgba(216,106,42,.28), transparent 62%),
       radial-gradient(760px 620px at 10% 12%, rgba(124,78,246,.42), transparent 60%),
       linear-gradient(118deg,#30037F 0%,#1B0550 44%,#0A0A14 100%);
     font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;}
  /* large watermark of the mark, right side, low opacity */
  .wm{position:absolute;right:-70px;top:50%;transform:translateY(-50%);
      width:560px;height:560px;opacity:.17;filter:saturate(1.15);}
  /* soft vignette so text stays legible */
  .vig{position:absolute;inset:0;
       background:linear-gradient(90deg,rgba(6,2,20,.62) 0%,rgba(6,2,20,.30) 42%,transparent 66%);}
  .lock{position:absolute;left:76px;top:50%;transform:translateY(-50%);
        display:flex;align-items:center;gap:30px;}
  .mark{width:142px;height:142px;flex:0 0 142px;
        filter:drop-shadow(0 10px 26px rgba(0,0,0,.45));}
  .name{font-size:76px;font-weight:700;letter-spacing:-2.4px;color:#fff;line-height:1;
        text-shadow:0 2px 20px rgba(0,0,0,.4);}
  .tag{margin-top:16px;font-size:28px;font-weight:500;letter-spacing:-.2px;
       color:#D9CCFF;line-height:1.25;}
  .rule{margin-top:20px;width:92px;height:5px;border-radius:3px;
        background:linear-gradient(90deg,#A78BFA,#E8833A);}
</style></head><body>
