  livekit_client: ^2.4.5

  # HLS playback for large SprayMe live rooms (viewers past the WebRTC threshold).
  video_player: ^2.9.2

  # Keep the screen awake during an active voice session (the bottomsheet is
  # connected) so the phone never sleeps mid-call.
  wakelock_plus: ^1.2.8

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  http: ^1.2.2
  get_it: ^8.0.3
  dartz: ^0.10.1
  flutter_svg: ^2.0.17
  flutter_native_splash: ^2.4.4
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  visibility_detector: ^0.4.0+2
  google_fonts: ^6.2.1
  motion_tab_bar: ^2.0.4
  smooth_page_indicator: ^1.2.0+3
  flutter_dotenv: ^5.2.1
