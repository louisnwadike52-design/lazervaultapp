  country_flags: ^3.3.0
  intl_phone_field: ^3.2.0
  screenshot: ^3.0.0
  url_launcher: ^6.3.1
  dio: ^5.7.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  webview_flutter_wkwebview: ^3.13.0
  rxdart: ^0.28.0
  mono_connect: ^2.1.0  # Mono Connect native SDK for bank account linking
  app_links: ^6.3.3  # Deep link handling for payment callbacks
  quick_actions: ^1.0.7  # App icon long-press shortcuts (Send Money, Scan to Pay, etc.)
  flutter_widget_from_html_core: ^0.17.0
  table_calendar: ^3.1.2
  ndef_record: ^1.4.2
  showcaseview: ^5.1.0
