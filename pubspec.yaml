  # grpc_generator: ^1.0.0
  freezed: ^3.2.5
  json_serializable: ^6.7.1

dependency_overrides:
  protobuf: ">=4.0.0 <5.0.0"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Launcher icons — regenerated from one master via:
#   dart run flutter_launcher_icons
# Master is the same RGBA file used everywhere else in the app, so the
# launcher icon and the in-app brand mark can never drift apart.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  # The home-screen icon is the ribbon mark on the brand-purple backdrop
  # (logo composited onto #3D2F8B — same purple as the splash). This is the
  # "with background" icon; iOS + legacy-Android launchers use it as-is.
  image_path: "assets/images/app_icon_with_bg.png"
  # iOS icons must be RGB (no alpha) — package strips alpha on build.
  remove_alpha_ios: true
  # Adaptive icon for Android 8+. The foreground is the transparent ribbon
  # mark; the background is the brand purple so the Android adaptive icon
  # matches the iOS / legacy icon (ribbon on purple, not on dark).
  adaptive_icon_background: "#3D2F8B"
  adaptive_icon_foreground: "assets/images/app_icon_master.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# Native splash screen — brand-purple backdrop with the ribbon icon
# centered. Run via: dart run flutter_native_splash:create
#
# Android 12+ uses windowSplashScreenAnimatedIcon, which the OS circularly
# clips down to a ~192dp safe area. We therefore use a padded master
# (1152×1152 canvas with the ribbon centered in the inner ~640×640) so the
# circular mask never crops the mark. The pre-A12 launch_background path
# uses the same image; it centers without scaling so the padding is also
# fine there.
flutter_native_splash:
  color: "#3D2F8B"
  image: "assets/images/app_icon_master_padded.png"
  branding: "assets/images/splash_branding.png"
  branding_mode: bottom
  # Lift the "lazervault" wordmark off the bottom edge so it isn't crowded
  # against the system nav bar / screen edge (it looked almost cut off flush
  # at 0dp). Applies to the pre-A12 launch_background + iOS storyboard.
  branding_bottom_padding: 48
  android_12:
    icon_background_color: "#3D2F8B"
    image: "assets/images/app_icon_master_padded.png"
    branding: "assets/images/splash_branding.png"
    branding_bottom_padding: 48

