dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  mocktail: ^1.0.0
  bloc_test: ^10.0.0

  # The "flutter_lints" package below contains a set of recommended lints to
